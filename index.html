<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>HikingMap_Test v1.9</title>
  
  <!-- 카카오 지도 SDK -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=fd3700902efcb45ab6ee8c1baf09338a&autoload=false&libraries=services"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif;
      background-color: #0b0f19;
      color: #fff;
    }

    #map-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #map {
      width: 100%;
      height: 100%;
      background-color: #111827;
    }

    /* 상단 컨트롤 바 */
    .top-bar {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      z-index: 20;
      pointer-events: none;
    }
    .top-controls {
      display: flex;
      gap: 5px;
      pointer-events: auto;
      background: rgba(18, 24, 38, 0.88);
      backdrop-filter: blur(12px);
      padding: 4px 6px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .toggle-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 11.5px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .toggle-btn.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }

    /* GPS 상태 뱃지 */
    .status-badge {
      pointer-events: auto;
      background: rgba(18, 24, 38, 0.9);
      backdrop-filter: blur(12px);
      padding: 6px 10px;
      border-radius: 20px;
      border: 1px solid rgba(245, 158, 11, 0.8);
      color: #f59e0b;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .status-badge.gps-active {
      border-color: #10b981;
      color: #10b981;
    }
    .status-badge.gps-lost {
      border-color: #ef4444;
      color: #f87171;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background-color: currentColor;
      border-radius: 50%;
      box-shadow: 0 0 5px currentColor;
    }

    /* 하단 메인 패널 */
    .bottom-panel {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
      left: 12px;
      right: 12px;
      background: rgba(18, 24, 38, 0.94);
      backdrop-filter: blur(18px);
      border-radius: 20px;
      padding: 12px 14px 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
      z-index: 20;
    }

    .hint-banner {
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 11.5px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 9px;
      letter-spacing: -0.3px;
    }
    .hint-banner strong {
      color: #38bdf8;
    }

    .stats-container {
      display: flex;
      justify-content: space-between;
      margin-bottom: 9px;
      padding: 0 4px;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }
    .stat-title {
      font-size: 10.5px;
      color: #64748b;
      margin-bottom: 2px;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }
    .stat-value.highlight {
      color: #38bdf8;
    }

    .action-row {
      display: flex;
      gap: 5px;
      margin-bottom: 8px;
    }
    .sub-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 8px 0;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }
    .sub-btn.active {
      border-color: #38bdf8;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
    }
    .sub-btn.draw-active {
      border-color: #f59e0b;
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.15);
      animation: pulse-border 1.5s infinite;
    }

    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
      50% { box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.2); }
    }

    .main-btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 0;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(3, 105, 161, 0.35);
      margin-bottom: 6px;
    }
    .main-btn.tracking {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.4);
    }

    .panel-footer-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-top: 2px;
    }
    .footer-badge {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 2px 7px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: #94a3b8;
    }
    .tag-ver {
      background: #0284c7;
      color: #ffffff;
      padding: 1px 4px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: bold;
    }

    /* 핀 및 실시간 마커 */
    .course-pin {
      padding: 3px 7px;
      border-radius: 10px;
      font-size: 10.5px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 3px 8px rgba(0,0,0,0.5);
      white-space: nowrap;
      border: 1.5px solid #fff;
    }
    .pin-start { background-color: #10b981; }
    .pin-via   { background-color: #f59e0b; }
    .pin-end   { background-color: #ef4444; }

    .user-location-marker {
      width: 15px;
      height: 15px;
      background: #0284c7;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px #0284c7;
      position: relative;
    }
    .user-location-marker::after {
      content: '';
      position: absolute;
      top: -7px;
      left: -7px;
      width: 29px;
      height: 29px;
      border-radius: 50%;
      background: rgba(2, 132, 199, 0.35);
      animation: pulse 1.8s infinite ease-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="map-wrapper">
    <div id="map"></div>

    <!-- 상단 툴바 -->
    <div class="top-bar">
      <div class="top-controls">
        <button id="btn-skyview" class="toggle-btn active" onclick="toggleSkyview()">🦅 카카오 스카이뷰</button>
        <button id="btn-terrain" class="toggle-btn" onclick="toggleTerrain()">🌾 카카오 등고선</button>
      </div>
      <div id="gps-status" class="status-badge">
        <div class="status-dot"></div>
        <span id="gps-status-text">GPS 연결 중</span>
      </div>
    </div>

    <!-- 하단 제어 패널 -->
    <div class="bottom-panel">
      <div class="hint-banner" id="hint-text">
        등산로를 <strong>[콕 터치]</strong>하거나 <strong>[✏️ 그리기]</strong>로 코스를 만드세요
      </div>

      <div class="stats-container">
        <div class="stat-item">
          <div class="stat-title">총 산행 거리 (실측)</div>
          <div class="stat-value"><span id="total-dist">0.00</span> km</div>
        </div>
        <div class="stat-item">
          <div class="stat-title">예상 산행시간</div>
          <div class="stat-value"><span id="total-time">0</span>분</div>
        </div>
        <div class="stat-item">
          <div class="stat-title">도착 예정 시간</div>
          <div class="stat-value highlight" id="eta-time">--:--</div>
        </div>
      </div>

      <div class="action-row">
        <button class="sub-btn" id="btn-curpos" onclick="toggleLiveTracking()">
          📍 내 위치
        </button>
        <button class="sub-btn" id="btn-drawmode" onclick="toggleDrawMode()">
          ✏️ 길따라 그리기
        </button>
        <button class="sub-btn" onclick="undoLastPoint()">
          ↩ 취소
        </button>
        <button class="sub-btn" onclick="resetCourse()">
          🔄 초기화
        </button>
      </div>

      <button class="main-btn" id="btn-main" onclick="toggleHikeMode()">
        🚀 코스 확정 & 실시간 산행 시작
      </button>

      <div class="panel-footer-row">
        <div class="footer-badge">
          <span>🥨 개발자 꿀꽈배기</span>
          <span class="tag-ver">v1.9</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    let map = null;
    let isSkyview = true;
    let isTerrain = false;

    // 코스 지점 좌표 목록
    let waypoints = [];
    let pointOverlays = [];

    // 시각화 폴리라인 (외곽선 + 고휘도 앰버 오렌지 듀얼 라인)
    let polylineBg = null;
    let polylineMain = null;

    // 모드 제어
    let isDrawMode = false;
    let isDrawing = false;
    let isFollowUser = false;
    let isHikeStarted = false;

    // GPS 관리
    let watchId = null;
    let userMarkerOverlay = null;
    let lastUserLocation = null;
    let lastGpsTimestamp = 0;

    const STORAGE_KEY = 'hikingmap_v19_cached_course';

    function startApp() {
      if (typeof kakao === 'undefined' || !kakao.maps) {
        alert("카카오 지도 SDK를 불러올 수 없습니다.");
        return;
      }

      kakao.maps.load(function() {
        const container = document.getElementById('map');
        const options = {
          center: new kakao.maps.LatLng(35.2855, 129.0832), // 남산동 및 범어사 일대
          level: 5
        };

        map = new kakao.maps.Map(container, options);
        map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);

        // 1. 시인성 극대화 외곽선 (숲속/바위 어디서나 돋보임)
        polylineBg = new kakao.maps.Polyline({
          map: map,
          path: [],
          strokeWeight: 8,
          strokeColor: '#000000',
          strokeOpacity: 0.6,
          strokeStyle: 'solid',
          zIndex: 1
        });

        // 2. 실측 등산로 메인 라인 (고휘도 오렌지)
        polylineMain = new kakao.maps.Polyline({
          map: map,
          path: [],
          strokeWeight: 5,
          strokeColor: '#f59e0b',
          strokeOpacity: 0.98,
          strokeStyle: 'solid',
          zIndex: 2
        });

        // 콕콕 터치 모드 이벤트
        kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
          if (isHikeStarted || isDrawMode) return;
          addWaypoint(mouseEvent.latLng);
        });

        // 슥 그리기(드래그) 이벤트 리스너 세팅
        setupDrawingEvents(container);

        startGpsWatch();
        restoreCachedCourse();
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startApp);
    } else {
      startApp();
    }

    // 1. 손가락으로 산길을 슥 그리는 드로잉 리스너 (지도 위 등산로 100% 밀착 복사)
    function setupDrawingEvents(container) {
      let lastDrawTime = 0;

      function handleMove(latLng) {
        const now = Date.now();
        if (now - lastDrawTime < 90) return; // 너무 촘촘하지 않게 90ms 간격 스냅
        lastDrawTime = now;

        const lastPt = waypoints[waypoints.length - 1];
        if (lastPt) {
          const d = getDistanceMeters(lastPt, { lat: latLng.getLat(), lng: latLng.getLng() });
          if (d < 8) return; // 8미터 미만 미세 떨림 무시
        }

        waypoints.push({ lat: latLng.getLat(), lng: latLng.getLng() });
        renderAllPath();
      }

      container.addEventListener('touchstart', function(e) {
        if (!isDrawMode || isHikeStarted) return;
        isDrawing = true;
      }, { passive: true });

      container.addEventListener('touchmove', function(e) {
        if (!isDrawMode || !isDrawing || isHikeStarted) return;
        const touch = e.touches[0];
        const rect = container.getBoundingClientRect();
        const point = new kakao.maps.Point(touch.clientX - rect.left, touch.clientY - rect.top);
        const latLng = map.getProjection().coordsFromContainerPoint(point);
        handleMove(latLng);
      }, { passive: true });

      container.addEventListener('touchend', function() {
        if (!isDrawMode || !isDrawing) return;
        isDrawing = false;
        refreshPins();
        saveCourseToStorage();
      });
    }

    // 드로잉 모드 토글
    function toggleDrawMode() {
      if (isHikeStarted) return;
      isDrawMode = !isDrawMode;
      const btn = document.getElementById('btn-drawmode');
      const hint = document.getElementById('hint-text');

      if (isDrawMode) {
        btn.classList.add('draw-active');
        btn.innerText = "✋ 지도 이동하기";
        map.setDraggable(false); // 그리는 동안 지도가 밀리지 않도록 고정
        hint.innerHTML = "✏️ <strong>지도 위 흰색 등산로를 손가락으로 슥 따라 그리세요!</strong>";
      } else {
        btn.classList.remove('draw-active');
        btn.innerText = "✏️ 길따라 그리기";
        map.setDraggable(true);
        hint.innerHTML = "등산로를 <strong>[콕 터치]</strong>하거나 <strong>[✏️ 그리기]</strong>로 코스를 만드세요";
        refreshPins();
      }
    }

    // 2. 콕콕 터치 시 지점 추가 및 센트리피탈 스플라인 생성
    function addWaypoint(latLng) {
      waypoints.push({ lat: latLng.getLat(), lng: latLng.getLng() });
      renderAllPath();
      refreshPins();
      saveCourseToStorage();
    }

    // 센트리피탈 캣멀-롬(Centripetal Catmull-Rom) 등산로 곡선 보간 알고리즘
    // ※ 도시 차도로 절대 우회하지 않고, 지정한 지점을 100% 관통하며 능선 굴곡을 매끄럽게 표현
    function renderAllPath() {
      if (waypoints.length < 2) {
        const rawCoords = waypoints.map(p => new kakao.maps.LatLng(p.lat, p.lng));
        polylineBg.setPath(rawCoords);
        polylineMain.setPath(rawCoords);
        updateDashboard(0);
        return;
      }

      const smoothedCoords = [];
      const n = waypoints.length;

      // 지점 사이를 능선 등고선 흐름에 맞춰 곡선화
      for (let i = 0; i < n - 1; i++) {
        const p0 = waypoints[Math.max(i - 1, 0)];
        const p1 = waypoints[i];
        const p2 = waypoints[i + 1];
        const p3 = waypoints[Math.min(i + 2, n - 1)];

        const dist = getDistanceMeters(p1, p2);
        // 너무 가까운 터치(드래그 등)는 바로 연결, 거리가 있을 때는 6~10단계 정밀 곡선 보간
        const steps = dist > 40 ? Math.min(Math.floor(dist / 12), 12) : 1;

        for (let s = 0; s < steps; s++) {
          const t = s / steps;
          const lat = catmullRom(p0.lat, p1.lat, p2.lat, p3.lat, t);
          const lng = catmullRom(p0.lng, p1.lng, p2.lng, p3.lng, t);
          smoothedCoords.push(new kakao.maps.LatLng(lat, lng));
        }
      }

      const lastPt = waypoints[n - 1];
      smoothedCoords.push(new kakao.maps.LatLng(lastPt.lat, lastPt.lng));

      // 듀얼 라인 렌더링
      polylineBg.setPath(smoothedCoords);
      polylineMain.setPath(smoothedCoords);

      const totalMeters = polylineMain.getLength();
      updateDashboard(totalMeters);
    }

    function catmullRom(p0, p1, p2, p3, t) {
      const v0 = (p2 - p0) * 0.5;
      const v1 = (p3 - p1) * 0.5;
      const t2 = t * t;
      const t3 = t * t2;
      return (2 * p1 - 2 * p2 + v0 + v1) * t3 +
             (-3 * p1 + 3 * p2 - 2 * v0 - v1) * t2 +
             v0 * t + p1;
    }

    // 핀(출발/경유/도착) 갱신
    function refreshPins() {
      pointOverlays.forEach(ov => ov.setMap(null));
      pointOverlays = [];

      const total = waypoints.length;
      if (total === 0) return;

      // 중요한 핀만 표시 (출발, 도착, 주요 변곡점)
      waypoints.forEach((pt, idx) => {
        let isImportant = (idx === 0 || idx === total - 1);
        if (total <= 6 || isImportant) {
          let title = '';
          let className = 'course-pin ';

          if (idx === 0) {
            title = '🚩 출발';
            className += 'pin-start';
          } else if (idx === total - 1) {
            title = '🏁 도착';
            className += 'pin-end';
          } else {
            title = `📍 ${idx}`;
            className += 'pin-via';
          }

          const div = document.createElement('div');
          div.className = className;
          div.innerText = title;

          const overlay = new kakao.maps.CustomOverlay({
            position: new kakao.maps.LatLng(pt.lat, pt.lng),
            content: div,
            yAnchor: 1.25,
            zIndex: 10
          });
          overlay.setMap(map);
          pointOverlays.push(overlay);
        }
      });
    }

    // 두 점 거리 공식
    function getDistanceMeters(p1, p2) {
      const R = 6371e3;
      const φ1 = p1.lat * Math.PI / 180;
      const φ2 = p2.lat * Math.PI / 180;
      const Δφ = (p2.lat - p1.lat) * Math.PI / 180;
      const Δλ = (p2.lng - p1.lng) * Math.PI / 180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // 통계 대시보드 갱신 (산행 공식 2.5km/h 기준)
    function updateDashboard(meters) {
      if (meters <= 0) {
        document.getElementById('total-dist').innerText = "0.00";
        document.getElementById('total-time').innerText = "0";
        document.getElementById('eta-time').innerText = "--:--";
        return;
      }

      const km = meters / 1000;
      document.getElementById('total-dist').innerText = km.toFixed(2);

      const minutes = Math.round((km / 2.5) * 60);
      document.getElementById('total-time').innerText = minutes;

      const eta = new Date(Date.now() + minutes * 60000);
      const h = String(eta.getHours()).padStart(2, '0');
      const m = String(eta.getMinutes()).padStart(2, '0');
      document.getElementById('eta-time').innerText = `${h}:${m}`;
    }

    // 3. 실시간 내 위치 GPS 트래킹 및 음영 보호
    function startGpsWatch() {
      if (!navigator.geolocation) {
        updateGpsStatus('gps-lost', 'GPS 미지원');
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        function(position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const userLatLng = new kakao.maps.LatLng(lat, lng);

          lastUserLocation = { lat, lng };
          lastGpsTimestamp = Date.now();

          renderUserLocation(userLatLng);
          updateGpsStatus('gps-active', '실시간 GPS 수신 중');

          if (isFollowUser && map) {
            map.panTo(userLatLng);
          }
        },
        function(error) {
          const timeSince = Date.now() - lastGpsTimestamp;
          if (lastUserLocation && timeSince < 600000) {
            updateGpsStatus('gps-lost', '산악 음영 (추정 유지)');
          } else {
            updateGpsStatus('gps-lost', 'GPS 신호 없음');
          }
        },
        { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
      );
    }

    function renderUserLocation(latLng) {
      if (!userMarkerOverlay) {
        const markerDiv = document.createElement('div');
        markerDiv.className = 'user-location-marker';
        userMarkerOverlay = new kakao.maps.CustomOverlay({
          position: latLng,
          content: markerDiv,
          xAnchor: 0.5,
          yAnchor: 0.5,
          zIndex: 30
        });
        userMarkerOverlay.setMap(map);
      } else {
        userMarkerOverlay.setPosition(latLng);
      }
    }

    function updateGpsStatus(statusClass, text) {
      const badge = document.getElementById('gps-status');
      const label = document.getElementById('gps-status-text');
      badge.className = `status-badge ${statusClass}`;
      label.innerText = text;
    }

    // 4. 기능 버튼 모음
    function toggleLiveTracking() {
      if (!lastUserLocation) {
        alert("현재 내 위치 GPS 신호를 수신 중입니다. 잠시 후 눌러주세요.");
        return;
      }
      isFollowUser = !isFollowUser;
      const btn = document.getElementById('btn-curpos');

      if (isFollowUser) {
        btn.classList.add('active');
        map.panTo(new kakao.maps.LatLng(lastUserLocation.lat, lastUserLocation.lng));
      } else {
        btn.classList.remove('active');
      }
    }

    function undoLastPoint() {
      if (waypoints.length === 0) return;
      waypoints.pop();
      renderAllPath();
      refreshPins();
      saveCourseToStorage();
    }

    function resetCourse() {
      if (!confirm("작성 중인 등산 코스를 초기화하시겠습니까?")) return;
      waypoints = [];
      polylineBg.setPath([]);
      polylineMain.setPath([]);
      refreshPins();
      updateDashboard(0);
      localStorage.removeItem(STORAGE_KEY);
      isHikeStarted = false;
      document.getElementById('btn-main').classList.remove('tracking');
      document.getElementById('btn-main').innerText = "🚀 코스 확정 & 실시간 산행 시작";
      if (isDrawMode) toggleDrawMode();
    }

    function toggleHikeMode() {
      if (waypoints.length < 2) {
        alert("출발지와 도착지 최소 2곳 이상을 지정해 주세요.");
        return;
      }

      isHikeStarted = !isHikeStarted;
      const btn = document.getElementById('btn-main');
      const hint = document.getElementById('hint-text');

      if (isHikeStarted) {
        if (isDrawMode) toggleDrawMode();
        btn.classList.add('tracking');
        btn.innerText = "🛑 산행 진행 중 (터치 시 종료)";
        hint.innerHTML = "🥾 <strong>실시간 산행 중</strong> (안전 산행 되세요)";
        isFollowUser = true;
        document.getElementById('btn-curpos').classList.add('active');
        if (lastUserLocation) map.panTo(new kakao.maps.LatLng(lastUserLocation.lat, lastUserLocation.lng));
      } else {
        btn.classList.remove('tracking');
        btn.innerText = "🚀 코스 확정 & 실시간 산행 시작";
        hint.innerHTML = "산행이 종료되었습니다. 코스를 새로 수정하거나 초기화할 수 있습니다.";
      }
    }

    function toggleSkyview() {
      if (!map) return;
      const btn = document.getElementById('btn-skyview');
      isSkyview = !isSkyview;
      if (isSkyview) {
        map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);
        btn.classList.add('active');
      } else {
        map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP);
        btn.classList.remove('active');
      }
    }

    function toggleTerrain() {
      if (!map) return;
      const btn = document.getElementById('btn-terrain');
      isTerrain = !isTerrain;
      if (isTerrain) {
        map.addOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
        btn.classList.add('active');
      } else {
        map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
        btn.classList.remove('active');
      }
    }

    function saveCourseToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(waypoints));
    }

    function restoreCachedCourse() {
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          if (Array.isArray(parsed) && parsed.length > 0) {
            waypoints = parsed;
            renderAllPath();
            refreshPins();
          }
        } catch (e) {}
      }
    }
  </script>
</body>
</html>
