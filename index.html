<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>실시간 음성 산행 네비게이션 v2.3</title>
<!-- [카카오 지도 API 키 연동 완료] -->
<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=fd3700902efcb45ab6ee8c1baf09338a&libraries=services"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0f17; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  
  #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; background: #0b0f17; }

  /* 상단 플로팅 컨트롤 바 */
  .rt-top-bar {
    position: absolute;
    top: 14px;
    left: 12px;
    right: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 100;
  }
  .rt-map-toggle-group {
    display: flex;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(10px);
    border-radius: 999px;
    padding: 3px;
    border: 1px solid rgba(255, 255, 255, 0.12);
  }
  .rt-toggle-btn {
    border: none;
    background: transparent;
    color: #94a3b8;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.2s;
  }
  .rt-toggle-btn.active {
    background: #0284c7;
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(2, 132, 199, 0.5);
  }

  .rt-voice-btn {
    background: rgba(6, 78, 59, 0.88);
    backdrop-filter: blur(10px);
    border: 1px solid #10b981;
    color: #4ade80;
    font-size: 11px;
    font-weight: 800;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .rt-voice-btn.muted {
    background: rgba(30, 41, 59, 0.88);
    border-color: #64748b;
    color: #94a3b8;
  }

  .rt-gps-status {
    margin-left: auto;
    background: rgba(11, 15, 23, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #4ade80;
    font-size: 10px;
    font-weight: 800;
    padding: 6px 10px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .rt-gps-dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 6px #22c55e; }

  /* 하단 산행 콕핏 대시보드 */
  .rt-bottom-panel {
    position: absolute;
    bottom: 16px;
    left: 12px;
    right: 12px;
    background: rgba(16, 23, 38, 0.94);
    backdrop-filter: blur(14px);
    border: 1px solid #1e293b;
    border-radius: 18px;
    padding: 14px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
    z-index: 100;
    color: #f8fafc;
  }
  .rt-panel-header {
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: #38bdf8;
    margin-bottom: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
  }

  /* 산행 지표 3단 그리드 */
  .rt-metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    text-align: center;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    margin-bottom: 12px;
  }
  .rt-metric-col { display: flex; flex-direction: column; gap: 4px; }
  .rt-metric-title { font-size: 10px; font-weight: 600; color: #94a3b8; }
  .rt-metric-val { font-size: 19px; font-weight: 900; letter-spacing: -0.5px; }
  .val-white { color: #ffffff; }
  .val-cyan  { color: #38bdf8; }

  /* 제어 툴바 */
  .rt-tools-row {
    display: grid;
    grid-template-columns: 1fr 1.3fr 0.8fr 0.8fr;
    gap: 6px;
    margin-bottom: 10px;
  }
  .rt-tool-btn {
    background: #1e293b;
    border: 1px solid #334155;
    color: #f1f5f9;
    font-size: 11px;
    font-weight: 700;
    padding: 8px 4px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .rt-tool-btn:active { background: #334155; }
  .rt-tool-btn.drawing { background: #0284c7; border-color: #38bdf8; color: #fff; }

  /* 주 실행 버튼 (산행 시작 / 종료) */
  .rt-action-btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 13px;
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    transition: all 0.2s;
  }
  .btn-start { background: linear-gradient(135deg, #0284c7, #0369a1); }
  .btn-active {
    background: linear-gradient(135deg, #059669, #047857);
    border: 1px solid #34d399;
    animation: hikePulse 2s infinite;
  }
  @keyframes hikePulse {
    0%, 100% { box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }
    50% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.75); }
  }

  /* 하단 브랜딩 뱃지 */
  .rt-footer-badge {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-top: 8px;
    gap: 6px;
  }
  .rt-dev-pill {
    background: #090e17;
    border: 1px solid #1e293b;
    border-radius: 6px;
    padding: 2px 6px;
    font-size: 9.5px;
    font-weight: 700;
    color: #94a3b8;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .rt-ver-tag { background: #0284c7; color: #fff; border-radius: 4px; padding: 1px 4px; font-size: 9px; }

  /* 핀 마커 배지 */
  .rt-pin-badge {
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 800;
    color: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    white-space: nowrap;
    border: 1.5px solid rgba(255,255,255,0.8);
  }
  .badge-start { background: #0284c7; }
  .badge-dest  { background: #ef4444; }
  
  /* GPS 내 위치 마커 */
  .rt-gps-marker {
    width: 16px;
    height: 16px;
    background: #0284c7;
    border: 3px solid #ffffff;
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(2, 132, 199, 1);
  }
</style>
</head>
<body>

<div id="map"></div>

<!-- 상단 컨트롤 바 -->
<div class="rt-top-bar">
  <div class="rt-map-toggle-group">
    <button class="rt-toggle-btn active" id="btn-skyview" onclick="toggleSkyview()">🦅 스카이뷰</button>
    <button class="rt-toggle-btn active" id="btn-terrain" onclick="toggleTerrain()">🌾 등고선</button>
  </div>
  <button class="rt-voice-btn" id="btn-voice" onclick="toggleVoice()">🪶 음성 켜짐</button>
  <div class="rt-gps-status">
    <span class="rt-gps-dot"></span>
    <span id="txt-gps">실시간 GPS 수신 중</span>
  </div>
</div>

<!-- 하단 산행 콕핏 -->
<div class="rt-bottom-panel">
  <div class="rt-panel-header">
    <span>🦅</span>
    <span id="txt-hike-status">실시간 음성 산행 준비 (경로를 설정하세요)</span>
  </div>

  <div class="rt-metrics-grid">
    <div class="rt-metric-col">
      <span class="rt-metric-title">총 산행 거리 (실측)</span>
      <span class="rt-metric-val val-white" id="val-distance">0.00 km</span>
    </div>
    <div class="rt-metric-col">
      <span class="rt-metric-title">예상 산행시간</span>
      <span class="rt-metric-val val-white" id="val-duration">0분</span>
    </div>
    <div class="rt-metric-col">
      <span class="rt-metric-title">도착 예정 시간</span>
      <span class="rt-metric-val val-cyan" id="val-eta">--:--</span>
    </div>
  </div>

  <div class="rt-tools-row">
    <button class="rt-tool-btn" onclick="panToUserLocation()">📍 내 위치</button>
    <button class="rt-tool-btn" id="btn-draw" onclick="toggleDrawMode()">✏️ 길따라 그리기</button>
    <button class="rt-tool-btn" onclick="undoLastPoint()">↩️ 취소</button>
    <button class="rt-tool-btn" onclick="resetRoute()">🔄 초기화</button>
  </div>

  <button class="rt-action-btn btn-start" id="btn-hike-toggle" onclick="toggleHiking()">
    <span id="txt-action-label">산행 시작</span>
  </button>

  <div class="rt-footer-badge">
    <div class="rt-dev-pill">
      <span>🥨 개발자 꿀꽈배기</span>
      <span class="rt-ver-tag">v2.3</span>
    </div>
  </div>
</div>

<script>
  var map = null;
  var isSkyview = true;
  var isTerrain = true;
  var isVoiceOn = true;
  var isDrawing = false;
  var isHiking = false;

  var pathCoords = [];
  var activePolyline = null;
  var startOverlay = null;
  var destOverlay = null;
  var userMarker = null;
  var watchId = null;

  var currentDistKm = 0;
  var currentUserPos = null;

  function speak(msg) {
    if (!isVoiceOn || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    var ut = new SpeechSynthesisUtterance(msg);
    ut.lang = 'ko-KR';
    ut.rate = 1.0;
    window.speechSynthesis.speak(ut);
  }

  function initKakaoMap() {
    var container = document.getElementById('map');
    var options = {
      center: new kakao.maps.LatLng(35.2818, 129.0494), // 금정산 장군봉 기준
      level: 4
    };
    map = new kakao.maps.Map(container, options);

    // 스카이뷰 및 등고선 기본 활성화
    map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);
    map.addOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);

    // 지도 클릭 시 경로 그리기
    kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
      if (!isDrawing) return;
      var latlng = mouseEvent.latLng;
      addRoutePoint(latlng);
    });

    startGpsTracking();
  }

  function toggleSkyview() {
    isSkyview = !isSkyview;
    var btn = document.getElementById('btn-skyview');
    if (isSkyview) {
      map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);
      btn.classList.add('active');
    } else {
      map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP);
      btn.classList.remove('active');
    }
    if (isTerrain) map.addOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
  }

  function toggleTerrain() {
    isTerrain = !isTerrain;
    var btn = document.getElementById('btn-terrain');
    if (isTerrain) {
      map.addOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
      btn.classList.add('active');
    } else {
      map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
      btn.classList.remove('active');
    }
  }

  function toggleVoice() {
    isVoiceOn = !isVoiceOn;
    var btn = document.getElementById('btn-voice');
    if (isVoiceOn) {
      btn.textContent = '🪶 음성 켜짐';
      btn.className = 'rt-voice-btn';
      speak('음성 안내가 켜졌습니다.');
    } else {
      btn.textContent = '🔇 음성 꺼짐';
      btn.className = 'rt-voice-btn muted';
      window.speechSynthesis.cancel();
    }
  }

  function toggleDrawMode() {
    isDrawing = !isDrawing;
    var btn = document.getElementById('btn-draw');
    if (isDrawing) {
      btn.classList.add('drawing');
      speak('지도를 터치하여 산행 경로를 그려주세요.');
    } else {
      btn.classList.remove('drawing');
    }
  }

  function addRoutePoint(latlng) {
    pathCoords.push(latlng);
    renderPath();
  }

  function undoLastPoint() {
    if (pathCoords.length > 0) {
      pathCoords.pop();
      renderPath();
    }
  }

  function resetRoute() {
    if (isHiking) {
      alert('산행 진행 중에는 초기화할 수 없습니다. 산행을 먼저 종료해주세요.');
      return;
    }
    pathCoords = [];
    if (activePolyline) { activePolyline.setMap(null); activePolyline = null; }
    if (startOverlay)   { startOverlay.setMap(null); startOverlay = null; }
    if (destOverlay)    { destOverlay.setMap(null); destOverlay = null; }
    currentDistKm = 0;
    updateMetrics(0);
    document.getElementById('txt-hike-status').textContent = '실시간 음성 산행 준비 (경로를 설정하세요)';
    speak('경로가 초기화되었습니다.');
  }

  function renderPath() {
    if (activePolyline) activePolyline.setMap(null);
    if (startOverlay) startOverlay.setMap(null);
    if (destOverlay) destOverlay.setMap(null);

    if (pathCoords.length === 0) {
      updateMetrics(0);
      return;
    }

    activePolyline = new kakao.maps.Polyline({
      path: pathCoords,
      strokeWeight: 6,
      strokeColor: '#f59e0b',
      strokeOpacity: 0.95,
      strokeStyle: 'solid'
    });
    activePolyline.setMap(map);

    if (pathCoords.length >= 1) {
      var sContent = '<div class="rt-pin-badge badge-start">🚩 출발</div>';
      startOverlay = new kakao.maps.CustomOverlay({ position: pathCoords[0], content: sContent, yAnchor: 1.3 });
      startOverlay.setMap(map);
    }

    if (pathCoords.length >= 2) {
      var dContent = '<div class="rt-pin-badge badge-dest">🏁 도착</div>';
      destOverlay = new kakao.maps.CustomOverlay({ position: pathCoords[pathCoords.length - 1], content: dContent, yAnchor: 1.3 });
      destOverlay.setMap(map);
    }

    var totalMeters = activePolyline.getLength();
    currentDistKm = totalMeters / 1000.0;
    updateMetrics(currentDistKm);
  }

  function updateMetrics(distKm) {
    document.getElementById('val-distance').textContent = distKm.toFixed(2) + ' km';
    if (distKm <= 0.01) {
      document.getElementById('val-duration').textContent = '0분';
      document.getElementById('val-eta').textContent = '--:--';
      return;
    }
    var totalMinutes = Math.round((distKm / 2.5) * 60);
    document.getElementById('val-duration').textContent = totalMinutes + '분';

    var now = new Date();
    var eta = new Date(now.getTime() + totalMinutes * 60000);
    var h = eta.getHours();
    var m = eta.getMinutes();
    document.getElementById('val-eta').textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }

  function toggleHiking() {
    isHiking = !isHiking;
    var btn = document.getElementById('btn-hike-toggle');
    var label = document.getElementById('txt-action-label');
    var statusTitle = document.getElementById('txt-hike-status');

    if (isHiking) {
      isDrawing = false;
      document.getElementById('btn-draw').classList.remove('drawing');
      btn.className = 'rt-action-btn btn-active';
      label.textContent = '🔴 산행 진행 중 (터치 시 종료)';
      statusTitle.textContent = '실시간 음성 산행 중 (안전 산행 되세요)';
      speak('안전 산행을 시작합니다. 현재 경로를 따라 이동하세요.');
    } else {
      btn.className = 'rt-action-btn btn-start';
      label.textContent = '산행 시작';
      statusTitle.textContent = '산행이 완료되었습니다.';
      speak('산행을 종료합니다. 수고하셨습니다.');
    }
  }

  function startGpsTracking() {
    if (!('geolocation' in navigator)) return;

    watchId = navigator.geolocation.watchPosition(function(pos) {
      var lat = pos.coords.latitude;
      var lng = pos.coords.longitude;
      currentUserPos = new kakao.maps.LatLng(lat, lng);

      document.getElementById('txt-gps').textContent = '실시간 GPS 수신 중';

      if (!userMarker) {
        var markerContent = '<div class="rt-gps-marker"></div>';
        userMarker = new kakao.maps.CustomOverlay({
          position: currentUserPos,
          content: markerContent,
          zIndex: 999
        });
        userMarker.setMap(map);
      } else {
        userMarker.setPosition(currentUserPos);
      }
    }, function(err) {
      document.getElementById('txt-gps').textContent = 'GPS 신호 대기 중';
    }, {
      enableHighAccuracy: true,
      maximumAge: 3000,
      timeout: 10000
    });
  }

  function panToUserLocation() {
    if (currentUserPos) {
      map.panTo(currentUserPos);
      speak('현재 내 위치로 이동합니다.');
    } else {
      alert('현재 GPS 위치 정보를 수신 중입니다.');
    }
  }

  // SDK 안전 로드
  window.onload = function() {
    if (typeof kakao !== 'undefined' && kakao.maps) {
      kakao.maps.load(initKakaoMap);
    } else {
      console.error('카카오맵 스크립트를 불러오지 못했습니다.');
    }
  };
</script>
</body>
</html>
