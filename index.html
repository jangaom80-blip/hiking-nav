<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HikingMap_Test</title>
  
  <!-- 카카오 지도 SDK (반드시 본인의 JavaScript 키 입력) -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_JAVASCRIPT_KEY&libraries=services"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background-color: #0b0f19;
      color: #fff;
    }

    #map-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    /* 상단 플로팅 컨트롤 바 */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      z-index: 20;
      pointer-events: none;
    }
    .top-controls {
      display: flex;
      gap: 6px;
      pointer-events: auto;
      background: rgba(18, 24, 38, 0.85);
      backdrop-filter: blur(10px);
      padding: 5px 8px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .toggle-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 12.5px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .toggle-btn.active {
      background: #0ea5e9;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(14, 165, 233, 0.4);
    }

    .status-badge {
      margin-left: auto;
      pointer-events: auto;
      background: rgba(18, 24, 38, 0.85);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid #f59e0b;
      color: #f59e0b;
      font-size: 12.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      background-color: #f59e0b;
      border-radius: 50%;
      box-shadow: 0 0 6px #f59e0b;
    }

    /* 하단 메인 패널 */
    .bottom-panel {
      position: absolute;
      bottom: 24px;
      left: 16px;
      right: 16px;
      background: rgba(18, 24, 38, 0.92);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 20;
    }

    .hint-banner {
      background: rgba(255, 255, 255, 0.06);
      padding: 8px 14px;
      border-radius: 14px;
      font-size: 12.5px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 14px;
    }

    .stats-container {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 0 8px;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }
    .stat-title {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }
    .stat-value.highlight {
      color: #38bdf8;
    }

    .action-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .sub-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 11px 0;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .sub-btn:active {
      background: rgba(255, 255, 255, 0.15);
    }
    .sub-btn.active {
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .main-btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 13px 0;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(3, 105, 161, 0.4);
    }
    .main-btn:active {
      filter: brightness(0.9);
    }

    /* 개발자 크레딧 뱃지 */
    .footer-badge {
      position: absolute;
      bottom: -32px;
      right: 0;
      background: rgba(18, 24, 38, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #94a3b8;
    }
    .tag-ver {
      background: #0284c7;
      color: #ffffff;
      padding: 1px 5px;
      border-radius: 6px;
      font-size: 9.5px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="map-container">
    <!-- 카카오 지도 컨테이너 -->
    <div id="map"></div>

    <!-- 상단 툴바 -->
    <div class="top-bar">
      <div class="top-controls">
        <button id="btn-skyview" class="toggle-btn active" onclick="toggleSkyview()">
          <span>🦅</span> 카카오 스카이뷰
        </button>
        <button id="btn-terrain" class="toggle-btn" onclick="toggleTerrain()">
          <span>🌾</span> 카카오 등고선
        </button>
      </div>
      <div class="status-badge">
        <div class="status-dot"></div>
        <span>등산로 경로 연결 중...</span>
      </div>
    </div>

    <!-- 하단 코스 정보 및 제어 패널 -->
    <div class="bottom-panel">
      <div class="hint-banner">
        지도 위 등산로를 콕 터치해 코스를 이어가세요
      </div>

      <div class="stats-container">
        <div class="stat-item">
          <div class="stat-title">총 산행 거리 (실측)</div>
          <div class="stat-value"><span id="total-dist">0.00</span> km</div>
        </div>
        <div class="stat-item">
          <div class="stat-title">예상 산행시간</div>
          <div class="stat-value"><span id="total-time">0</span>분</div>
        </div>
        <div class="stat-item">
          <div class="stat-title">도착 예정 시간</div>
          <div class="stat-value highlight" id="eta-time">--:--</div>
        </div>
      </div>

      <div class="action-row">
        <button class="sub-btn" id="btn-curpos" onclick="setCurrentLocationStart()">
          📍 내 위치를 출발점으로
        </button>
        <button class="sub-btn" onclick="undoLastPoint()">
          ↩ 직전 지점 취소
        </button>
      </div>

      <button class="main-btn" onclick="startHiking()">
        🚀 코스 확정 & 실시간 산행 시작
      </button>

      <div class="footer-badge">
        <span>🥨 개발자 꿀꽈배기</span>
        <span class="tag-ver">v1.5</span>
      </div>
    </div>
  </div>

  <script>
    let map = null;
    let isSkyview = true;
    let isTerrain = false;

    // 경로 데이터 및 시각화 객체
    let pathCoordinates = [];
    let markers = [];
    let polyline = null;

    // 부산 금정산 / 양산 사송리 일대 (캡처 이미지 기준 초기 중심점)
    const initialCenter = new kakao.maps.LatLng(35.3056, 129.0682);

    window.onload = function() {
      const container = document.getElementById('map');
      const options = {
        center: initialCenter,
        level: 5
      };

      map = new kakao.maps.Map(container, options);

      // 기본 스카이뷰 활성화
      map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);

      // 코스 선(Polyline) 생성
      polyline = new kakao.maps.Polyline({
        map: map,
        path: [],
        strokeWeight: 5,
        strokeColor: '#f59e0b', // 산행 강조 오렌지-옐로우 색상
        strokeOpacity: 0.9,
        strokeStyle: 'solid'
      });

      // 지도 클릭 시 포인트 추가
      kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
        addPoint(mouseEvent.latLng);
      });
    };

    // 스카이뷰 토글
    function toggleSkyview() {
      const btn = document.getElementById('btn-skyview');
      isSkyview = !isSkyview;

      if (isSkyview) {
        map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);
        btn.classList.add('active');
      } else {
        map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP);
        btn.classList.remove('active');
      }
    }

    // 등고선 오버레이 토글
    function toggleTerrain() {
      const btn = document.getElementById('btn-terrain');
      isTerrain = !isTerrain;

      if (isTerrain) {
        map.addOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
        btn.classList.add('active');
      } else {
        map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
        btn.classList.remove('active');
      }
    }

    // 좌표 포인트 추가
    function addPoint(latLng) {
      pathCoordinates.push(latLng);

      // 출발지 혹은 경유지 마커 표시
      const isStart = pathCoordinates.length === 1;
      const marker = new kakao.maps.Marker({
        position: latLng,
        map: map
      });
      markers.push(marker);

      // 선 경로 갱신
      polyline.setPath(pathCoordinates);

      // 거리 및 산행시간 재계산
      calculateStats();
    }

    // 직전 지점 취소
    function undoLastPoint() {
      if (pathCoordinates.length === 0) return;

      pathCoordinates.pop();
      const lastMarker = markers.pop();
      if (lastMarker) {
        lastMarker.setMap(null);
      }

      polyline.setPath(pathCoordinates);
      calculateStats();
    }

    // 통계(거리, 예상시간, 도착예정시각) 계산
    function calculateStats() {
      if (pathCoordinates.length < 2) {
        document.getElementById('total-dist').innerText = "0.00";
        document.getElementById('total-time').innerText = "0";
        document.getElementById('eta-time').innerText = "--:--";
        return;
      }

      // 총 거리(m -> km)
      const distanceInMeters = polyline.getLength();
      const distanceInKm = distanceInMeters / 1000;
      document.getElementById('total-dist').innerText = distanceInKm.toFixed(2);

      // 산행 평균 보행속도 기준 (약 2.5km/h = 분당 약 41.6m)
      const estimatedMinutes = Math.round(distanceInKm / 2.5 * 60);
      document.getElementById('total-time').innerText = estimatedMinutes;

      // 도착 예정 시간(ETA)
      const now = new Date();
      now.setMinutes(now.getMinutes() + estimatedMinutes);
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('eta-time').innerText = `${hours}:${minutes}`;
    }

    // 내 위치를 출발점으로 설정 (Geolocation)
    function setCurrentLocationStart() {
      if (!navigator.geolocation) {
        alert("이 브라우저에서는 위치 정보를 지원하지 않습니다.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const userLatLng = new kakao.maps.LatLng(lat, lng);

          map.panTo(userLatLng);
          addPoint(userLatLng);
          document.getElementById('btn-curpos').classList.add('active');
        },
        function(err) {
          alert("내 위치를 가져올 수 없습니다: " + err.message);
        },
        { enableHighAccuracy: true }
      );
    }

    // 코스 확정 & 실시간 산행 시작
    function startHiking() {
      if (pathCoordinates.length < 2) {
        alert("최소 2곳 이상의 등산로 지점을 터치하여 코스를 만들어주세요.");
        return;
      }
      alert("코스가 확정되었습니다! 안전한 산행을 시작합니다 🥾");
    }
  </script>
</body>
</html>
