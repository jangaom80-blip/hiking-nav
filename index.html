<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>HikingMap_Test v2.3</title>
  
  <!-- 카카오 지도 SDK -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=fd3700902efcb45ab6ee8c1baf09338a&autoload=false&libraries=services"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif;
      background-color: #0b0f19;
      color: #fff;
    }

    #map-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #map {
      width: 100%;
      height: 100%;
      background-color: #111827;
    }

    /* 상단 컨트롤 바 */
    .top-bar {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      z-index: 20;
      pointer-events: none;
    }
    .top-controls {
      display: flex;
      gap: 5px;
      pointer-events: auto;
      background: rgba(18, 24, 38, 0.88);
      backdrop-filter: blur(12px);
      padding: 4px 6px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .toggle-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 9px;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .toggle-btn.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }
    .toggle-btn.voice-active {
      background: #059669;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(5, 150, 105, 0.4);
    }

    /* GPS 및 상태 표시 뱃지 */
    .status-badge {
      pointer-events: auto;
      background: rgba(18, 24, 38, 0.9);
      backdrop-filter: blur(12px);
      padding: 6px 10px;
      border-radius: 20px;
      border: 1px solid rgba(245, 158, 11, 0.8);
      color: #f59e0b;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .status-badge.gps-active {
      border-color: #10b981;
      color: #10b981;
    }
    .status-badge.nav-speaking {
      border-color: #38bdf8;
      color: #38bdf8;
      animation: pulse-border 1s infinite;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background-color: currentColor;
      border-radius: 50%;
      box-shadow: 0 0 5px currentColor;
    }

    /* 하단 메인 패널 */
    .bottom-panel {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
      left: 12px;
      right: 12px;
      background: rgba(18, 24, 38, 0.94);
      backdrop-filter: blur(18px);
      border-radius: 20px;
      padding: 12px 14px 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
      z-index: 20;
    }

    .hint-banner {
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 11.5px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 9px;
      letter-spacing: -0.3px;
    }
    .hint-banner strong {
      color: #38bdf8;
    }

    .stats-container {
      display: flex;
      justify-content: space-between;
      margin-bottom: 9px;
      padding: 0 4px;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }
    .stat-title {
      font-size: 10.5px;
      color: #64748b;
      margin-bottom: 2px;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }
    .stat-value.highlight {
      color: #38bdf8;
    }

    .action-row {
      display: flex;
      gap: 5px;
      margin-bottom: 8px;
    }
    .sub-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 8px 0;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }
    .sub-btn.active {
      border-color: #38bdf8;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
    }
    .sub-btn.draw-active {
      border-color: #f59e0b;
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.18);
      animation: pulse-border 1.5s infinite;
    }

    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.4); }
      50% { box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.2); }
    }

    .main-btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 0;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(3, 105, 161, 0.35);
      margin-bottom: 6px;
    }
    .main-btn.tracking {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.4);
    }

    .panel-footer-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-top: 2px;
    }
    .footer-badge {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 2px 7px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: #94a3b8;
    }
    .tag-ver {
      background: #0284c7;
      color: #ffffff;
      padding: 1px 4px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: bold;
    }

    /* 핀 및 실시간 마커 */
    .course-pin {
      padding: 3px 7px;
      border-radius: 10px;
      font-size: 10.5px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 3px 8px rgba(0,0,0,0.5);
      white-space: nowrap;
      border: 1.5px solid #fff;
    }
    .pin-start { background-color: #10b981; }
    .pin-via   { background-color: #f59e0b; }
    .pin-end   { background-color: #ef4444; }

    .user-location-marker {
      width: 15px;
      height: 15px;
      background: #0284c7;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px #0284c7;
      position: relative;
    }
    .user-location-marker::after {
      content: '';
      position: absolute;
      top: -7px;
      left: -7px;
      width: 29px;
      height: 29px;
      border-radius: 50%;
      background: rgba(2, 132, 199, 0.35);
      animation: pulse 1.8s infinite ease-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="map-wrapper">
    <div id="map"></div>

    <!-- 상단 툴바 -->
    <div class="top-bar">
      <div class="top-controls">
        <button id="btn-skyview" class="toggle-btn active" onclick="toggleSkyview()">🦅 스카이뷰</button>
        <button id="btn-terrain" class="toggle-btn" onclick="toggleTerrain()">🌾 등고선</button>
        <button id="btn-voice" class="toggle-btn voice-active" onclick="toggleVoice()">🔊 음성 켜짐</button>
      </div>
      <div id="gps-status" class="status-badge">
        <div class="status-dot"></div>
        <span id="gps-status-text">GPS 대기</span>
      </div>
    </div>

    <!-- 하단 제어 패널 -->
    <div class="bottom-panel">
      <div class="hint-banner" id="hint-text">
        등산로 굽은 곳을 <strong>[순서대로 콕콕 터치]</strong>하면 산길에 100% 밀착됩니다
      </div>

      <div class="stats-container">
        <div class="stat-item">
          <div class="stat-title">총 산행 거리 (실측)</div>
          <div class="stat-value"><span id="total-dist">0.00</span> km</div>
        </div>
        <div class="stat-item">
          <div class="stat-title">예상 산행시간</div>
          <div class="stat-value"><span id="total-time">0</span>분</div>
        </div>
        <div class="stat-item">
          <div class="stat-title">도착 예정 시간</div>
          <div class="stat-value highlight" id="eta-time">--:--</div>
        </div>
      </div>

      <div class="action-row">
        <button class="sub-btn" id="btn-curpos" onclick="toggleLiveTracking()">
          📍 내 위치
        </button>
        <button class="sub-btn" id="btn-drawmode" onclick="toggleDrawMode()">
          ✏️ 길따라 그리기
        </button>
        <button class="sub-btn" onclick="undoLastPoint()">
          ↩ 취소
        </button>
        <button class="sub-btn" onclick="resetCourse()">
          🔄 초기화
        </button>
      </div>

      <button class="main-btn" id="btn-main" onclick="toggleHikeMode()">
        🚀 코스 확정 & 실시간 산행 시작
      </button>

      <div class="panel-footer-row">
        <div class="footer-badge">
          <span>🥨 개발자 꿀꽈배기</span>
          <span class="tag-ver">v2.3</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    let map = null;
    let isSkyview = true;
    let isTerrain = false;
    let isVoiceActive = true;

    let waypoints = [];
    let pointOverlays = [];
    let routeSegments = []; 

    let polylineBg = null;
    let polylineMain = null;

    let isDrawMode = false;
    let isDrawing = false;
    let isFollowUser = false;
    let isHikeStarted = false;

    // 음성 내비게이션 추적 변수
    let nextTargetWaypointIdx = 1; // 다음 목표 지점 (1: 첫번째 경유지 또는 도착지)
    let lastOffTrailWarningTime = 0;

    let watchId = null;
    let userMarkerOverlay = null;
    let lastUserLocation = null;
    let lastGpsTimestamp = 0;

    const STORAGE_KEY = 'hikingmap_v23_cached_course';

    // ==========================================
    // 0. 실시간 한국어 음성 합성 엔진 (Web Speech API)
    // ==========================================
    function speak(text) {
      if (!isVoiceActive || !('speechSynthesis' in window)) return;
      
      try {
        window.speechSynthesis.cancel(); // 진행 중인 음성 즉시 중단
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 1.05; // 자연스러운 산행 안내 속도
        utterance.pitch = 1.0;

        const badge = document.getElementById('gps-status');
        badge.classList.add('nav-speaking');
        utterance.onend = () => badge.classList.remove('nav-speaking');
        utterance.onerror = () => badge.classList.remove('nav-speaking');

        window.speechSynthesis.speak(utterance);
      } catch (e) {}
    }

    function toggleVoice() {
      isVoiceActive = !isVoiceActive;
      const btn = document.getElementById('btn-voice');
      if (isVoiceActive) {
        btn.classList.add('voice-active');
        btn.innerText = "🔊 음성 켜짐";
        speak("음성 안내가 켜졌습니다.");
      } else {
        btn.classList.remove('voice-active');
        btn.innerText = "🔈 음성 꺼짐";
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    }

    function startApp() {
      if (typeof kakao === 'undefined' || !kakao.maps) {
        alert("카카오 지도 SDK를 불러올 수 없습니다.");
        return;
      }

      kakao.maps.load(function() {
        const container = document.getElementById('map');
        const options = {
          center: new kakao.maps.LatLng(35.2855, 129.0832),
          level: 5
        };

        map = new kakao.maps.Map(container, options);
        map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);

        polylineBg = new kakao.maps.Polyline({
          map: map,
          path: [],
          strokeWeight: 8,
          strokeColor: '#000000',
          strokeOpacity: 0.65,
          strokeStyle: 'solid',
          zIndex: 1
        });

        polylineMain = new kakao.maps.Polyline({
          map: map,
          path: [],
          strokeWeight: 5,
          strokeColor: '#f59e0b',
          strokeOpacity: 0.98,
          strokeStyle: 'solid',
          zIndex: 2
        });

        kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
          if (isHikeStarted || isDrawMode) return;
          handleTapWaypoint(mouseEvent.latLng);
        });

        setupDrawingEvents(container);
        startGpsWatch();
        restoreCachedCourse();
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startApp);
    } else {
      startApp();
    }

    // ==========================================
    // 1. 산악 라우팅 엔진 (BRouter + OSRM + 능선 커브)
    // ==========================================
    async function handleTapWaypoint(latLng) {
      const newPt = { lat: latLng.getLat(), lng: latLng.getLng() };
      waypoints.push(newPt);
      refreshPins();

      if (waypoints.length === 1) {
        document.getElementById('hint-text').innerHTML = "다음 산길 모퉁이를 터치하면 <strong>실제 등산로가 정밀하게 추적</strong>됩니다";
        return;
      }

      const p1 = waypoints[waypoints.length - 2];
      const p2 = newPt;

      const initialSeg = [new kakao.maps.LatLng(p1.lat, p1.lng), new kakao.maps.LatLng(p2.lat, p2.lng)];
      routeSegments.push(initialSeg);
      renderAllPolylines();

      updateGpsStatus('routing', '정밀 등산로 추적 중...');
      const preciseTrail = await getPreciseMountainTrail(p1, p2);

      routeSegments[routeSegments.length - 1] = preciseTrail;
      renderAllPolylines();

      updateGpsStatus('gps-active', '실시간 GPS 수신 중');
      saveCourseToStorage();
    }

    async function getPreciseMountainTrail(p1, p2) {
      const straightDist = getDistanceMeters(p1, p2);

      try {
        const url = `https://brouter.de/brouter?lonlats=${p1.lng},${p1.lat}%7C${p2.lng},${p2.lat}&profile=hiking-mountain&alternativeidx=0&format=geojson`;
        const res = await fetch(url, { signal: AbortSignal.timeout(2600) });
        if (res.ok) {
          const data = await res.json();
          if (data.features && data.features[0] && data.features[0].geometry) {
            const coords = data.features[0].geometry.coordinates;
            const totalDist = parseFloat(data.features[0].properties['total-distance'] || 0);
            if (coords && coords.length > 2 && (straightDist < 250 || totalDist / straightDist <= 2.2)) {
              return coords.map(c => new kakao.maps.LatLng(c[1], c[0]));
            }
          }
        }
      } catch (e) {}

      try {
        const url = `https://routing.openstreetmap.de/routed-foot/route/v1/walking/${p1.lng},${p1.lat};${p2.lng},${p2.lat}?overview=full&geometries=geojson`;
        const res = await fetch(url, { signal: AbortSignal.timeout(2200) });
        if (res.ok) {
          const data = await res.json();
          if (data.routes && data.routes[0]) {
            const coords = data.routes[0].geometry.coordinates;
            const routeDist = data.routes[0].distance;
            if (coords && coords.length > 2 && (straightDist < 200 || routeDist / straightDist <= 1.8)) {
              return coords.map(c => new kakao.maps.LatLng(c[1], c[0]));
            }
          }
        }
      } catch (e) {}

      return generateRidgeAdaptiveCurve(p1, p2);
    }

    function generateRidgeAdaptiveCurve(p1, p2) {
      const dist = getDistanceMeters(p1, p2);
      if (dist < 25) {
        return [new kakao.maps.LatLng(p1.lat, p1.lng), new kakao.maps.LatLng(p2.lat, p2.lng)];
      }

      const coords = [];
      const steps = 10;
      const dx = p2.lng - p1.lng;
      const dy = p2.lat - p1.lat;

      const offsetFactor = Math.min(dist / 1000, 0.12);
      const nx = -dy * offsetFactor;
      const ny = dx * offsetFactor;

      const cp1 = { lat: p1.lat + dy * 0.35 + ny, lng: p1.lng + dx * 0.35 + nx };
      const cp2 = { lat: p1.lat + dy * 0.65 - ny * 0.6, lng: p1.lng + dx * 0.65 - nx * 0.6 };

      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const lat = Math.pow(1-t, 3)*p1.lat + 3*Math.pow(1-t, 2)*t*cp1.lat + 3*(1-t)*Math.pow(t, 2)*cp2.lat + Math.pow(t, 3)*p2.lat;
        const lng = Math.pow(1-t, 3)*p1.lng + 3*Math.pow(1-t, 2)*t*cp1.lng + 3*(1-t)*Math.pow(t, 2)*cp2.lng + Math.pow(t, 3)*p2.lng;
        coords.push(new kakao.maps.LatLng(lat, lng));
      }
      return coords;
    }

    function renderAllPolylines() {
      const fullPath = [];
      routeSegments.forEach((seg, idx) => {
        if (idx === 0) fullPath.push(...seg);
        else fullPath.push(...seg.slice(1));
      });

      polylineBg.setPath(fullPath);
      polylineMain.setPath(fullPath);
      updateDashboard(polylineMain.getLength());
    }

    // ==========================================
    // 2. 실시간 GPS 감시 & 음성 내비게이션 핵심 로직
    // ==========================================
    function startGpsWatch() {
      if (!navigator.geolocation) {
        updateGpsStatus('gps-lost', 'GPS 미지원');
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        function(position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const userLatLng = new kakao.maps.LatLng(lat, lng);

          lastUserLocation = { lat, lng };
          lastGpsTimestamp = Date.now();

          renderUserLocation(userLatLng);
          updateGpsStatus('gps-active', '실시간 GPS 수신 중');

          if (isFollowUser && map) map.panTo(userLatLng);

          // 산행 중일 때 실시간 음성 길안내 판정
          if (isHikeStarted && waypoints.length >= 2) {
            processVoiceNavigation(lat, lng);
          }
        },
        function(error) {
          const timeSince = Date.now() - lastGpsTimestamp;
          if (lastUserLocation && timeSince < 600000) {
            updateGpsStatus('gps-lost', '산악 음영 (추정 유지)');
          } else {
            updateGpsStatus('gps-lost', 'GPS 신호 없음');
          }
        },
        { enableHighAccuracy: true, maximumAge: 2500, timeout: 10000 }
      );
    }

    // 음성 길안내 판정 (교차로, 좌/우측 회전, 도착, 이탈 감지)
    function processVoiceNavigation(userLat, userLng) {
      if (nextTargetWaypointIdx >= waypoints.length) return;

      const targetPt = waypoints[nextTargetWaypointIdx];
      const distToTarget = getDistanceMeters({ lat: userLat, lng: userLng }, targetPt);
      const isFinalDest = (nextTargetWaypointIdx === waypoints.length - 1);

      // 1. 목적지 부근 도착 안내 (반경 35m 이내)
      if (isFinalDest && distToTarget <= 35) {
        speak("목적지 부근에 도착했습니다. 오늘 산행도 수고하셨습니다!");
        document.getElementById('hint-text').innerHTML = "🏁 <strong>목적지 부근에 도착했습니다.</strong> 산행 종료!";
        nextTargetWaypointIdx++;
        return;
      }

      // 2. 중간 경유지 / 갈림길 통과 시 방향 안내 (반경 30m 이내)
      if (!isFinalDest && distToTarget <= 30) {
        const prevPt = waypoints[nextTargetWaypointIdx - 1];
        const nextPt = waypoints[nextTargetWaypointIdx + 1];

        // 방위각 계산 (들어오는 각도 vs 나가는 각도)
        const inBearing = calculateBearing(prevPt, targetPt);
        const outBearing = calculateBearing(targetPt, nextPt);
        let turnAngle = (outBearing - inBearing + 360) % 360;

        let turnMessage = "경유지 부근입니다. 등산로를 따라 계속 진행하세요.";
        if (turnAngle >= 35 && turnAngle <= 150) {
          turnMessage = `경유 ${nextTargetWaypointIdx} 지점 부근입니다. 잠시 후 우측 방향 산길로 진행하세요.`;
        } else if (turnAngle >= 210 && turnAngle <= 325) {
          turnMessage = `경유 ${nextTargetWaypointIdx} 지점 부근입니다. 잠시 후 좌측 방향 산길로 진행하세요.`;
        } else {
          turnMessage = `경유 ${nextTargetWaypointIdx} 지점을 통과합니다. 능선을 따라 직진하세요.`;
        }

        speak(turnMessage);
        document.getElementById('hint-text').innerHTML = `🔊 <strong>[안내]</strong> ${turnMessage}`;
        nextTargetWaypointIdx++;
        return;
      }

      // 3. 등산로 코스 이탈 경고 (코스 폴리라인과 60m 이상 이탈 시 40초마다 경고)
      const now = Date.now();
      if (now - lastOffTrailWarningTime > 40000) {
        if (distToTarget > 60 && isPointFarFromPolyline({ lat: userLat, lng: userLng }, 60)) {
          speak("등산로를 이탈했습니다. 스마트폰 지도를 확인해 주세요.");
          document.getElementById('hint-text').innerHTML = "⚠️ <strong>등산로를 이탈했습니다!</strong> 경로를 확인하세요.";
          lastOffTrailWarningTime = now;
        }
      }
    }

    // 방위각(Bearing) 산출 공식
    function calculateBearing(p1, p2) {
      const φ1 = p1.lat * Math.PI / 180;
      const φ2 = p2.lat * Math.PI / 180;
      const Δλ = (p2.lng - p1.lng) * Math.PI / 180;
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    // 코스 라인과의 최단거리 체크 (이탈 방어)
    function isPointFarFromPolyline(pt, thresholdMeters) {
      const path = polylineMain.getPath();
      if (!path || path.length < 2) return false;
      for (let i = 0; i < path.length; i++) {
        const coord = path[i];
        const d = getDistanceMeters(pt, { lat: coord.getLat(), lng: coord.getLng() });
        if (d <= thresholdMeters) return false; // 코스 근처에 있음
      }
      return true;
    }

    // ==========================================
    // 3. 버튼 조작 및 산행 모드
    // ==========================================
    function toggleHikeMode() {
      if (waypoints.length < 2) {
        alert("출발지와 도착지 최소 2곳 이상을 지정해 주세요.");
        return;
      }

      isHikeStarted = !isHikeStarted;
      const btn = document.getElementById('btn-main');
      const hint = document.getElementById('hint-text');

      if (isHikeStarted) {
        if (isDrawMode) toggleDrawMode();
        btn.classList.add('tracking');
        btn.innerText = "🛑 산행 진행 중 (터치 시 종료)";
        nextTargetWaypointIdx = 1;

        // [핵심] 출발 음성 안내
        speak("등산 코스를 확정했습니다. 안전한 산행을 시작합니다.");
        hint.innerHTML = "🥾 <strong>실시간 음성 산행 중</strong> (안전 산행 되세요)";

        isFollowUser = true;
        document.getElementById('btn-curpos').classList.add('active');
        if (lastUserLocation) map.panTo(new kakao.maps.LatLng(lastUserLocation.lat, lastUserLocation.lng));
      } else {
        btn.classList.remove('tracking');
        btn.innerText = "🚀 코스 확정 & 실시간 산행 시작";
        speak("산행을 종료합니다. 오늘 산행도 수고하셨습니다.");
        hint.innerHTML = "산행이 종료되었습니다. 코스를 새로 수정하거나 초기화할 수 있습니다.";
      }
    }

    // 보조 그리기 모드
    function setupDrawingEvents(container) {
      let activeDrawSegment = [];
      let lastDrawTime = 0;

      container.addEventListener('touchstart', function(e) {
        if (!isDrawMode || isHikeStarted) return;
        isDrawing = true;
        activeDrawSegment = [];
      }, { passive: true });

      container.addEventListener('touchmove', function(e) {
        if (!isDrawMode || !isDrawing || isHikeStarted) return;
        const now = Date.now();
        if (now - lastDrawTime < 65) return;
        lastDrawTime = now;

        const touch = e.touches[0];
        const rect = container.getBoundingClientRect();
        const point = new kakao.maps.Point(touch.clientX - rect.left, touch.clientY - rect.top);
        const latLng = map.getProjection().coordsFromContainerPoint(point);

        activeDrawSegment.push(latLng);
        polylineMain.setPath([...polylineMain.getPath(), latLng]);
      }, { passive: true });

      container.addEventListener('touchend', function() {
        if (!isDrawMode || !isDrawing || activeDrawSegment.length < 2) {
          isDrawing = false;
          return;
        }
        isDrawing = false;

        const startCoord = activeDrawSegment[0];
        const endCoord = activeDrawSegment[activeDrawSegment.length - 1];

        if (waypoints.length === 0) {
          waypoints.push({ lat: startCoord.getLat(), lng: startCoord.getLng() });
        }
        waypoints.push({ lat: endCoord.getLat(), lng: endCoord.getLng() });

        routeSegments.push(activeDrawSegment);
        renderAllPolylines();
        refreshPins();
        saveCourseToStorage();
      });
    }

    function toggleDrawMode() {
      if (isHikeStarted) return;
      isDrawMode = !isDrawMode;
      const btn = document.getElementById('btn-drawmode');
      const hint = document.getElementById('hint-text');

      if (isDrawMode) {
        btn.classList.add('draw-active');
        btn.innerText = "✋ 그리기 완료";
        map.setDraggable(false);
        hint.innerHTML = "✏️ <strong>지도에 안 보이는 샛길을 손가락으로 슥 그리세요!</strong>";
      } else {
        btn.classList.remove('draw-active');
        btn.innerText = "✏️ 길따라 그리기";
        map.setDraggable(true);
        hint.innerHTML = "등산로 굽은 곳을 <strong>[순서대로 콕콕 터치]</strong>하면 산길에 100% 밀착됩니다";
      }
    }

    function refreshPins() {
      pointOverlays.forEach(ov => ov.setMap(null));
      pointOverlays = [];

      const total = waypoints.length;
      if (total === 0) {
        document.getElementById('hint-text').innerHTML = "등산로 굽은 곳을 <strong>[순서대로 콕콕 터치]</strong>하면 산길에 100% 밀착됩니다";
        return;
      }

      waypoints.forEach((pt, idx) => {
        let isImportant = (idx === 0 || idx === total - 1 || total <= 6);
        if (isImportant) {
          let title = '';
          let className = 'course-pin ';

          if (idx === 0) {
            title = '🚩 출발';
            className += 'pin-start';
          } else if (idx === total - 1) {
            title = '🏁 도착';
            className += 'pin-end';
          } else {
            title = `📍 ${idx}`;
            className += 'pin-via';
          }

          const div = document.createElement('div');
          div.className = className;
          div.innerText = title;

          const overlay = new kakao.maps.CustomOverlay({
            position: new kakao.maps.LatLng(pt.lat, pt.lng),
            content: div,
            yAnchor: 1.25,
            zIndex: 10
          });
          overlay.setMap(map);
          pointOverlays.push(overlay);
        }
      });
    }

    function undoLastPoint() {
      if (waypoints.length === 0) return;
      waypoints.pop();
      if (routeSegments.length > 0) routeSegments.pop();
      renderAllPolylines();
      refreshPins();
      saveCourseToStorage();
    }

    function resetCourse() {
      if (!confirm("작성 중인 등산 코스를 초기화하시겠습니까?")) return;
      waypoints = [];
      routeSegments = [];
      polylineBg.setPath([]);
      polylineMain.setPath([]);
      refreshPins();
      updateDashboard(0);
      localStorage.removeItem(STORAGE_KEY);
      isHikeStarted = false;
      document.getElementById('btn-main').classList.remove('tracking');
      document.getElementById('btn-main').innerText = "🚀 코스 확정 & 실시간 산행 시작";
      if (isDrawMode) toggleDrawMode();
    }

    function updateDashboard(meters) {
      if (meters <= 0) {
        document.getElementById('total-dist').innerText = "0.00";
        document.getElementById('total-time').innerText = "0";
        document.getElementById('eta-time').innerText = "--:--";
        return;
      }

      const km = meters / 1000;
      document.getElementById('total-dist').innerText = km.toFixed(2);

      const minutes = Math.round((km / 2.5) * 60);
      document.getElementById('total-time').innerText = minutes;

      const eta = new Date(Date.now() + minutes * 60000);
      const h = String(eta.getHours()).padStart(2, '0');
      const m = String(eta.getMinutes()).padStart(2, '0');
      document.getElementById('eta-time').innerText = `${h}:${m}`;
    }

    function getDistanceMeters(p1, p2) {
      const R = 6371e3;
      const φ1 = p1.lat * Math.PI / 180;
      const φ2 = p2.lat * Math.PI / 180;
      const Δφ = (p2.lat - p1.lat) * Math.PI / 180;
      const Δλ = (p2.lng - p1.lng) * Math.PI / 180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function renderUserLocation(latLng) {
      if (!userMarkerOverlay) {
        const markerDiv = document.createElement('div');
        markerDiv.className = 'user-location-marker';
        userMarkerOverlay = new kakao.maps.CustomOverlay({
          position: latLng,
          content: markerDiv,
          xAnchor: 0.5,
          yAnchor: 0.5,
          zIndex: 30
        });
        userMarkerOverlay.setMap(map);
      } else {
        userMarkerOverlay.setPosition(latLng);
      }
    }

    function updateGpsStatus(statusClass, text) {
      const badge = document.getElementById('gps-status');
      const label = document.getElementById('gps-status-text');
      badge.className = `status-badge ${statusClass}`;
      label.innerText = text;
    }

    function toggleLiveTracking() {
      if (!lastUserLocation) {
        alert("현재 내 위치 GPS 신호를 수신 중입니다. 잠시 후 눌러주세요.");
        return;
      }
      isFollowUser = !isFollowUser;
      const btn = document.getElementById('btn-curpos');
      if (isFollowUser) {
        btn.classList.add('active');
        map.panTo(new kakao.maps.LatLng(lastUserLocation.lat, lastUserLocation.lng));
      } else {
        btn.classList.remove('active');
      }
    }

    function toggleSkyview() {
      if (!map) return;
      const btn = document.getElementById('btn-skyview');
      isSkyview = !isSkyview;
      if (isSkyview) {
        map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);
        btn.classList.add('active');
      } else {
        map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP);
        btn.classList.remove('active');
      }
    }

    function toggleTerrain() {
      if (!map) return;
      const btn = document.getElementById('btn-terrain');
      isTerrain = !isTerrain;
      if (isTerrain) {
        map.addOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
        btn.classList.add('active');
      } else {
        map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
        btn.classList.remove('active');
      }
    }

    function saveCourseToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        waypoints: waypoints,
        segments: routeSegments.map(seg => seg.map(coord => ({ lat: coord.getLat(), lng: coord.getLng() })))
      }));
    }

    function restoreCachedCourse() {
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          if (parsed && parsed.waypoints && parsed.waypoints.length > 0) {
            waypoints = parsed.waypoints;
            routeSegments = (parsed.segments || []).map(seg => seg.map(c => new kakao.maps.LatLng(c.lat, c.lng)));
            renderAllPolylines();
            refreshPins();
          }
        } catch (e) {}
      }
    }
  </script>
