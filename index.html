<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>HikingMap_Test v1.7</title>
  
  <!-- 카카오 지도 SDK -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=fd3700902efcb45ab6ee8c1baf09338a&autoload=false&libraries=services"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    /* 모바일 브라우저 툴바 대응 (100dvh) */
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif;
      background-color: #0b0f19;
      color: #fff;
    }

    #map-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #map {
      width: 100%;
      height: 100%;
      background-color: #111827;
    }

    /* 상단 컨트롤 바 */
    .top-bar {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      z-index: 20;
      pointer-events: none;
    }
    .top-controls {
      display: flex;
      gap: 5px;
      pointer-events: auto;
      background: rgba(18, 24, 38, 0.88);
      backdrop-filter: blur(12px);
      padding: 4px 6px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .toggle-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 11.5px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .toggle-btn.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }

    /* GPS 상태 뱃지 */
    .status-badge {
      pointer-events: auto;
      background: rgba(18, 24, 38, 0.9);
      backdrop-filter: blur(12px);
      padding: 6px 10px;
      border-radius: 20px;
      border: 1px solid rgba(245, 158, 11, 0.8);
      color: #f59e0b;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .status-badge.gps-active {
      border-color: #10b981;
      color: #10b981;
    }
    .status-badge.gps-lost {
      border-color: #ef4444;
      color: #f87171;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background-color: currentColor;
      border-radius: 50%;
      box-shadow: 0 0 5px currentColor;
    }

    /* 하단 메인 패널 (잘림 방지 콤팩트 디자인) */
    .bottom-panel {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
      left: 12px;
      right: 12px;
      background: rgba(18, 24, 38, 0.94);
      backdrop-filter: blur(18px);
      border-radius: 20px;
      padding: 12px 14px 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
      z-index: 20;
    }

    .hint-banner {
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 11.5px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 9px;
      letter-spacing: -0.3px;
    }
    .hint-banner strong {
      color: #38bdf8;
    }

    .stats-container {
      display: flex;
      justify-content: space-between;
      margin-bottom: 9px;
      padding: 0 4px;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }
    .stat-title {
      font-size: 10.5px;
      color: #64748b;
      margin-bottom: 2px;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }
    .stat-value.highlight {
      color: #38bdf8;
    }

    .action-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .sub-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 8px 0;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }
    .sub-btn.active {
      border-color: #38bdf8;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
    }

    .main-btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 0;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(3, 105, 161, 0.35);
      margin-bottom: 6px;
    }
    .main-btn.tracking {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.4);
    }

    /* 패널 내부 하단 뱃지 영역 (잘림 절대 없음) */
    .panel-footer-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-top: 2px;
    }
    .footer-badge {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 2px 7px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: #94a3b8;
    }
    .tag-ver {
      background: #0284c7;
      color: #ffffff;
      padding: 1px 4px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: bold;
    }

    /* 핀 및 실시간 마커 */
    .course-pin {
      padding: 3px 7px;
      border-radius: 10px;
      font-size: 10.5px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 3px 8px rgba(0,0,0,0.45);
      white-space: nowrap;
      border: 1.5px solid #fff;
    }
    .pin-start { background-color: #10b981; }
    .pin-via   { background-color: #f59e0b; }
    .pin-end   { background-color: #ef4444; }

    .user-location-marker {
      width: 15px;
      height: 15px;
      background: #0284c7;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px #0284c7;
      position: relative;
    }
    .user-location-marker::after {
      content: '';
      position: absolute;
      top: -7px;
      left: -7px;
      width: 29px;
      height: 29px;
      border-radius: 50%;
      background: rgba(2, 132, 199, 0.35);
      animation: pulse 1.8s infinite ease-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="map-wrapper">
    <div id="map"></div>

    <!-- 상단 툴바 -->
    <div class="top-bar">
      <div class="top-controls">
        <button id="btn-skyview" class="toggle-btn active" onclick="toggleSkyview()">🦅 카카오 스카이뷰</button>
        <button id="btn-terrain" class="toggle-btn" onclick="toggleTerrain()">🌾 카카오 등고선</button>
      </div>
      <div id="gps-status" class="status-badge">
        <div class="status-dot"></div>
        <span id="gps-status-text">GPS 연결 중</span>
      </div>
    </div>

    <!-- 하단 패널 -->
    <div class="bottom-panel">
      <div class="hint-banner" id="hint-text">
        지도를 터치하여 <strong>[출발]</strong> 지점을 선택하세요
      </div>

      <div class="stats-container">
        <div class="stat-item">
          <div class="stat-title">총 산행 거리 (실측)</div>
          <div class="stat-value"><span id="total-dist">0.00</span> km</div>
        </div>
        <div class="stat-item">
          <div class="stat-title">예상 산행시간</div>
          <div class="stat-value"><span id="total-time">0</span>분</div>
        </div>
        <div class="stat-item">
          <div class="stat-title">도착 예정 시간</div>
          <div class="stat-value highlight" id="eta-time">--:--</div>
        </div>
      </div>

      <div class="action-row">
        <button class="sub-btn" id="btn-curpos" onclick="toggleLiveTracking()">
          📍 실시간 내 위치
        </button>
        <button class="sub-btn" onclick="undoLastPoint()">
          ↩ 직전 지점 취소
        </button>
        <button class="sub-btn" onclick="resetCourse()">
          🔄 초기화
        </button>
      </div>

      <button class="main-btn" id="btn-main" onclick="toggleHikeMode()">
        🚀 코스 확정 & 실시간 산행 시작
      </button>

      <!-- 뱃지를 패널 내부 하단으로 안전하게 배치 -->
      <div class="panel-footer-row">
        <div class="footer-badge">
          <span>🥨 개발자 꿀꽈배기</span>
          <span class="tag-ver">v1.7</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    let map = null;
    let isSkyview = true;
    let isTerrain = false;

    let waypoints = [];
    let pointOverlays = [];

    let detailedPathCoords = [];
    let trailPolyline = null;

    let watchId = null;
    let userMarkerOverlay = null;
    let lastUserLocation = null;
    let lastGpsTimestamp = 0;
    let isFollowUser = false;
    let isHikeStarted = false;

    const STORAGE_KEY = 'hikingmap_v17_cached_course';

    function startApp() {
      if (typeof kakao === 'undefined' || !kakao.maps) {
        alert("카카오 지도 SDK를 불러올 수 없습니다. 도메인 설정을 확인해 주세요.");
        return;
      }

      kakao.maps.load(function() {
        const container = document.getElementById('map');
        const options = {
          center: new kakao.maps.LatLng(35.3115, 129.0735),
          level: 5
        };

        map = new kakao.maps.Map(container, options);
        map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);

        trailPolyline = new kakao.maps.Polyline({
          map: map,
          path: [],
          strokeWeight: 6,
          strokeColor: '#f59e0b',
          strokeOpacity: 0.95,
          strokeStyle: 'solid'
        });

        kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
          if (isHikeStarted) return;
          addWaypoint(mouseEvent.latLng);
        });

        startGpsWatch();
        restoreCachedCourse();
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startApp);
    } else {
      startApp();
    }

    // 1. GPS 실시간 감시 & 터널/산악 음영 방어
    function startGpsWatch() {
      if (!navigator.geolocation) {
        updateGpsStatus('gps-lost', 'GPS 미지원');
        return;
      }

      const options = {
        enableHighAccuracy: true,
        maximumAge: 3000,
        timeout: 10000
      };

      watchId = navigator.geolocation.watchPosition(
        function(position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const userLatLng = new kakao.maps.LatLng(lat, lng);

          lastUserLocation = { lat, lng };
          lastGpsTimestamp = Date.now();

          renderUserLocation(userLatLng);
          updateGpsStatus('gps-active', '실시간 GPS 수신 중');

          if (isFollowUser && map) {
            map.panTo(userLatLng);
          }
        },
        function(error) {
          const timeSinceLastGps = Date.now() - lastGpsTimestamp;
          if (lastUserLocation && timeSinceLastGps < 600000) {
            updateGpsStatus('gps-lost', '산악 음영 (추정 유지)');
          } else {
            updateGpsStatus('gps-lost', 'GPS 신호 없음');
          }
        },
        options
      );

      setInterval(() => {
        if (lastGpsTimestamp > 0 && Date.now() - lastGpsTimestamp > 12000) {
          updateGpsStatus('gps-lost', '산악 음영 (추정 유지)');
        }
      }, 5000);
    }

    function renderUserLocation(latLng) {
      if (!userMarkerOverlay) {
        const markerDiv = document.createElement('div');
        markerDiv.className = 'user-location-marker';
        userMarkerOverlay = new kakao.maps.CustomOverlay({
          position: latLng,
          content: markerDiv,
          xAnchor: 0.5,
          yAnchor: 0.5,
          zIndex: 30
        });
        userMarkerOverlay.setMap(map);
      } else {
        userMarkerOverlay.setPosition(latLng);
      }
    }

    function updateGpsStatus(statusClass, text) {
      const badge = document.getElementById('gps-status');
      const label = document.getElementById('gps-status-text');
      badge.className = `status-badge ${statusClass}`;
      label.innerText = text;
    }

    // 2. 출발-경유-도착 핀 및 산길 곡선화
    async function addWaypoint(latLng) {
      const lat = latLng.getLat();
      const lng = latLng.getLng();

      waypoints.push({ lat, lng });
      refreshWaypointPins();

      await recalculateSmoothTrail();
      saveCourseToStorage();
    }

    function refreshWaypointPins() {
      pointOverlays.forEach(ov => ov.setMap(null));
      pointOverlays = [];

      const total = waypoints.length;
      waypoints.forEach((pt, idx) => {
        let title = '';
        let className = 'course-pin ';

        if (idx === 0) {
          title = '🚩 출발';
          className += 'pin-start';
        } else if (idx === total - 1) {
          title = '🏁 도착';
          className += 'pin-end';
        } else {
          title = `📍 경유 ${idx}`;
          className += 'pin-via';
        }

        const div = document.createElement('div');
        div.className = className;
        div.innerText = title;

        const overlay = new kakao.maps.CustomOverlay({
          position: new kakao.maps.LatLng(pt.lat, pt.lng),
          content: div,
          yAnchor: 1.25,
          zIndex: 10
        });
        overlay.setMap(map);
        pointOverlays.push(overlay);
      });

      const hint = document.getElementById('hint-text');
      if (total === 0) {
        hint.innerHTML = '지도를 터치하여 <strong>[출발]</strong> 지점을 선택하세요';
      } else if (total === 1) {
        hint.innerHTML = '다음 터치 시 <strong>[도착]</strong> 또는 <strong>[경유지]</strong> 연결';
      } else {
        hint.innerHTML = `현재 <strong>${total}개 지점</strong> 연결 완료`;
      }
    }

    // 직선 방지 산길 스플라인 및 도보 보간
    async function recalculateSmoothTrail() {
      if (waypoints.length < 2) {
        detailedPathCoords = waypoints.map(p => new kakao.maps.LatLng(p.lat, p.lng));
        trailPolyline.setPath(detailedPathCoords);
        updateDashboard(0);
        return;
      }

      detailedPathCoords = [];

      for (let i = 0; i < waypoints.length - 1; i++) {
        const start = waypoints[i];
        const end = waypoints[i + 1];

        let segmentCoords = await fetchFootpathRoute(start, end);

        if (!segmentCoords || segmentCoords.length === 0) {
          segmentCoords = generateMountainCurves(start, end);
        }

        if (i > 0 && segmentCoords.length > 0) {
          segmentCoords.shift();
        }
        detailedPathCoords.push(...segmentCoords);
      }

      trailPolyline.setPath(detailedPathCoords);
      const totalMeters = trailPolyline.getLength();
      updateDashboard(totalMeters);
    }

    async function fetchFootpathRoute(p1, p2) {
      try {
        const url = `https://router.project-osrm.org/route/v1/walking/${p1.lng},${p1.lat};${p2.lng},${p2.lat}?overview=full&geometries=geojson`;
        const res = await fetch(url, { signal: AbortSignal.timeout(1800) });
        if (!res.ok) return null;
        const data = await res.json();
        if (data.routes && data.routes[0]) {
          return data.routes[0].geometry.coordinates.map(coord => new kakao.maps.LatLng(coord[1], coord[0]));
        }
      } catch (e) {}
      return null;
    }

    function generateMountainCurves(p1, p2) {
      const coords = [];
      const steps = 12;

      const dx = p2.lng - p1.lng;
      const dy = p2.lat - p1.lat;
      const normalX = -dy * 0.16;
      const normalY = dx * 0.16;

      const cp1 = { lat: p1.lat + dy * 0.33 + normalY, lng: p1.lng + dx * 0.33 + normalX };
      const cp2 = { lat: p1.lat + dy * 0.66 - normalY * 0.8, lng: p1.lng + dx * 0.66 - normalX * 0.8 };

      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const lat = Math.pow(1 - t, 3) * p1.lat +
                    3 * Math.pow(1 - t, 2) * t * cp1.lat +
                    3 * (1 - t) * Math.pow(t, 2) * cp2.lat +
                    Math.pow(t, 3) * p2.lat;
        const lng = Math.pow(1 - t, 3) * p1.lng +
                    3 * Math.pow(1 - t, 2) * t * cp1.lng +
                    3 * (1 - t) * Math.pow(t, 2) * cp2.lng +
                    Math.pow(t, 3) * p2.lng;

        coords.push(new kakao.maps.LatLng(lat, lng));
      }
      return coords;
    }

    // 3. 통계 대시보드 갱신
    function updateDashboard(meters) {
      if (meters <= 0) {
        document.getElementById('total-dist').innerText = "0.00";
        document.getElementById('total-time').innerText = "0";
        document.getElementById('eta-time').innerText = "--:--";
        return;
      }

      const km = meters / 1000;
      document.getElementById('total-dist').innerText = km.toFixed(2);

      const minutes = Math.round((km / 2.5) * 60);
      document.getElementById('total-time').innerText = minutes;

      const eta = new Date(Date.now() + minutes * 60000);
      const h = String(eta.getHours()).padStart(2, '0');
      const m = String(eta.getMinutes()).padStart(2, '0');
      document.getElementById('eta-time').innerText = `${h}:${m}`;
    }

    // 4. 버튼 액션
    function toggleLiveTracking() {
      if (!lastUserLocation) {
        alert("현재 내 위치 GPS 신호를 수신 중입니다. 잠시 후 눌러주세요.");
        return;
      }
      isFollowUser = !isFollowUser;
      const btn = document.getElementById('btn-curpos');

      if (isFollowUser) {
        btn.classList.add('active');
        map.panTo(new kakao.maps.LatLng(lastUserLocation.lat, lastUserLocation.lng));
      } else {
        btn.classList.remove('active');
      }
    }

    async function undoLastPoint() {
      if (waypoints.length === 0) return;
      waypoints.pop();
      refreshWaypointPins();
      await recalculateSmoothTrail();
      saveCourseToStorage();
    }

    function resetCourse() {
      if (!confirm("작성 중인 등산 코스를 초기화하시겠습니까?")) return;
      waypoints = [];
      detailedPathCoords = [];
      refreshWaypointPins();
      trailPolyline.setPath([]);
      updateDashboard(0);
      localStorage.removeItem(STORAGE_KEY);
      isHikeStarted = false;
      document.getElementById('btn-main').classList.remove('tracking');
      document.getElementById('btn-main').innerText = "🚀 코스 확정 & 실시간 산행 시작";
    }

    function toggleHikeMode() {
      if (waypoints.length < 2) {
        alert("출발지와 도착지 최소 2곳 이상을 지정해 주세요.");
        return;
      }

      isHikeStarted = !isHikeStarted;
      const btn = document.getElementById('btn-main');
      const hint = document.getElementById('hint-text');

      if (isHikeStarted) {
        btn.classList.add('tracking');
        btn.innerText = "🛑 산행 진행 중 (터치 시 종료)";
        hint.innerHTML = "🥾 <strong>실시간 산행 중</strong> (안전 산행 되세요)";
        isFollowUser = true;
        document.getElementById('btn-curpos').classList.add('active');
        if (lastUserLocation) map.panTo(new kakao.maps.LatLng(lastUserLocation.lat, lastUserLocation.lng));
      } else {
        btn.classList.remove('tracking');
        btn.innerText = "🚀 코스 확정 & 실시간 산행 시작";
        hint.innerHTML = "산행이 종료되었습니다. 코스를 새로 수정하거나 초기화할 수 있습니다.";
      }
    }

    function toggleSkyview() {
      if (!map) return;
      const btn = document.getElementById('btn-skyview');
      isSkyview = !isSkyview;
      if (isSkyview) {
        map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);
        btn.classList.add('active');
      } else {
        map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP);
        btn.classList.remove('active');
      }
    }

    function toggleTerrain() {
      if (!map) return;
      const btn = document.getElementById('btn-terrain');
      isTerrain = !isTerrain;
      if (isTerrain) {
        map.addOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
        btn.classList.add('active');
      } else {
        map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
        btn.classList.remove('active');
      }
    }

    function saveCourseToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(waypoints));
    }

    async function restoreCachedCourse() {
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          if (Array.isArray(parsed) && parsed.length > 0) {
            waypoints = parsed;
            refreshWaypointPins();
            await recalculateSmoothTrail();
          }
        } catch (e) {}
      }
    }
  </script>
</body>
</html>
