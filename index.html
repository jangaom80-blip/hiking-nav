<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>HikingMap_Test v2.1</title>
  
  <!-- 카카오 지도 SDK -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=fd3700902efcb45ab6ee8c1baf09338a&autoload=false&libraries=services"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif;
      background-color: #0b0f19;
      color: #fff;
    }

    #map-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #map {
      width: 100%;
      height: 100%;
      background-color: #111827;
    }

    /* 상단 컨트롤 바 */
    .top-bar {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      z-index: 20;
      pointer-events: none;
    }
    .top-controls {
      display: flex;
      gap: 5px;
      pointer-events: auto;
      background: rgba(18, 24, 38, 0.88);
      backdrop-filter: blur(12px);
      padding: 4px 6px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .toggle-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 11.5px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .toggle-btn.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }

    /* GPS 및 상태 표시 뱃지 */
    .status-badge {
      pointer-events: auto;
      background: rgba(18, 24, 38, 0.9);
      backdrop-filter: blur(12px);
      padding: 6px 10px;
      border-radius: 20px;
      border: 1px solid rgba(245, 158, 11, 0.8);
      color: #f59e0b;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .status-badge.gps-active {
      border-color: #10b981;
      color: #10b981;
    }
    .status-badge.routing {
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background-color: currentColor;
      border-radius: 50%;
      box-shadow: 0 0 5px currentColor;
    }

    /* 하단 메인 패널 */
    .bottom-panel {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
      left: 12px;
      right: 12px;
      background: rgba(18, 24, 38, 0.94);
      backdrop-filter: blur(18px);
      border-radius: 20px;
      padding: 12px 14px 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
      z-index: 20;
    }

    .hint-banner {
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 11.5px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 9px;
      letter-spacing: -0.3px;
    }
    .hint-banner strong {
      color: #38bdf8;
    }

    .stats-container {
      display: flex;
      justify-content: space-between;
      margin-bottom: 9px;
      padding: 0 4px;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }
    .stat-title {
      font-size: 10.5px;
      color: #64748b;
      margin-bottom: 2px;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }
    .stat-value.highlight {
      color: #38bdf8;
    }

    .action-row {
      display: flex;
      gap: 5px;
      margin-bottom: 8px;
    }
    .sub-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 8px 0;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }
    .sub-btn.active {
      border-color: #38bdf8;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
    }
    .sub-btn.draw-active {
      border-color: #f59e0b;
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.18);
      animation: pulse-border 1.5s infinite;
    }

    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
      50% { box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.2); }
    }

    .main-btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 0;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(3, 105, 161, 0.35);
      margin-bottom: 6px;
    }
    .main-btn.tracking {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.4);
    }

    .panel-footer-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-top: 2px;
    }
    .footer-badge {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 2px 7px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: #94a3b8;
    }
    .tag-ver {
      background: #0284c7;
      color: #ffffff;
      padding: 1px 4px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: bold;
    }

    /* 핀 및 실시간 마커 */
    .course-pin {
      padding: 3px 7px;
      border-radius: 10px;
      font-size: 10.5px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 3px 8px rgba(0,0,0,0.5);
      white-space: nowrap;
      border: 1.5px solid #fff;
    }
    .pin-start { background-color: #10b981; }
    .pin-via   { background-color: #f59e0b; }
    .pin-end   { background-color: #ef4444; }

    .user-location-marker {
      width: 15px;
      height: 15px;
      background: #0284c7;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px #0284c7;
      position: relative;
    }
    .user-location-marker::after {
      content: '';
      position: absolute;
      top: -7px;
      left: -7px;
      width: 29px;
      height: 29px;
      border-radius: 50%;
      background: rgba(2, 132, 199, 0.35);
      animation: pulse 1.8s infinite ease-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="map-wrapper">
    <div id="map"></div>

    <!-- 상단 툴바 -->
    <div class="top-bar">
      <div class="top-controls">
        <button id="btn-skyview" class="toggle-btn active" onclick="toggleSkyview()">🦅 카카오 스카이뷰</button>
        <button id="btn-terrain" class="toggle-btn" onclick="toggleTerrain()">🌾 카카오 등고선</button>
      </div>
      <div id="gps-status" class="status-badge">
        <div class="status-dot"></div>
        <span id="gps-status-text">GPS 연결 중</span>
      </div>
    </div>

    <!-- 하단 제어 패널 -->
    <div class="bottom-panel">
      <div class="hint-banner" id="hint-text">
        등산로 꺾임목을 <strong>[콕콕 터치]</strong>하면 산길을 정밀하게 이어갑니다
      </div>

      <div class="stats-container">
        <div class="stat-item">
          <div class="stat-title">총 산행 거리 (실측)</div>
          <div class="stat-value"><span id="total-dist">0.00</span> km</div>
        </div>
        <div class="stat-item">
          <div class="stat-title">예상 산행시간</div>
          <div class="stat-value"><span id="total-time">0</span>분</div>
        </div>
        <div class="stat-item">
          <div class="stat-title">도착 예정 시간</div>
          <div class="stat-value highlight" id="eta-time">--:--</div>
        </div>
      </div>

      <div class="action-row">
        <button class="sub-btn" id="btn-curpos" onclick="toggleLiveTracking()">
          📍 내 위치
        </button>
        <button class="sub-btn" id="btn-drawmode" onclick="toggleDrawMode()">
          ✏️ 길따라 그리기
        </button>
        <button class="sub-btn" onclick="undoLastPoint()">
          ↩ 취소
        </button>
        <button class="sub-btn" onclick="resetCourse()">
          🔄 초기화
        </button>
      </div>

      <button class="main-btn" id="btn-main" onclick="toggleHikeMode()">
        🚀 코스 확정 & 실시간 산행 시작
      </button>

      <div class="panel-footer-row">
        <div class="footer-badge">
          <span>🥨 개발자 꿀꽈배기</span>
          <span class="tag-ver">v2.1</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    let map = null;
    let isSkyview = true;
    let isTerrain = false;

    let waypoints = [];
    let pointOverlays = [];
    let routeSegments = []; 

    // 시인성 극대화 듀얼 라인 (블랙 테두리 + 고휘도 앰버 오렌지)
    let polylineBg = null;
    let polylineMain = null;

    let isDrawMode = false;
    let isDrawing = false;
    let isFollowUser = false;
    let isHikeStarted = false;

    let watchId = null;
    let userMarkerOverlay = null;
    let lastUserLocation = null;
    let lastGpsTimestamp = 0;

    const STORAGE_KEY = 'hikingmap_v21_cached_course';

    function startApp() {
      if (typeof kakao === 'undefined' || !kakao.maps) {
        alert("카카오 지도 SDK를 불러올 수 없습니다.");
        return;
      }

      kakao.maps.load(function() {
        const container = document.getElementById('map');
        const options = {
          center: new kakao.maps.LatLng(35.2855, 129.0832),
          level: 5
        };

        map = new kakao.maps.Map(container, options);
        map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);

        // 1. 외곽선 (숲속/암릉 어디서나 또렷하게 보임)
        polylineBg = new kakao.maps.Polyline({
          map: map,
          path: [],
          strokeWeight: 8,
          strokeColor: '#000000',
          strokeOpacity: 0.65,
          strokeStyle: 'solid',
          zIndex: 1
        });

        // 2. 메인 산길 실선 (고휘도 오렌지)
        polylineMain = new kakao.maps.Polyline({
          map: map,
          path: [],
          strokeWeight: 5,
          strokeColor: '#f59e0b',
          strokeOpacity: 0.98,
          strokeStyle: 'solid',
          zIndex: 2
        });

        // 클릭 이벤트 (이탈 없는 등산로 콕콕 연결)
        kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
          if (isHikeStarted || isDrawMode) return;
          handleTapWaypoint(mouseEvent.latLng);
        });

        // 보조 그리기 이벤트 리스너
        setupDrawingEvents(container);

        startGpsWatch();
        restoreCachedCourse();
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startApp);
    } else {
      startApp();
    }

    // 1. 지점 터치 시 산길 정밀 연결 (가짜 곡선 100% 배제)
    async function handleTapWaypoint(latLng) {
      const newPt = { lat: latLng.getLat(), lng: latLng.getLng() };
      waypoints.push(newPt);
      refreshPins();

      if (waypoints.length === 1) {
        document.getElementById('hint-text').innerHTML = "등산로 모퉁이/갈림길을 <strong>순서대로 콕콕 터치</strong>하세요";
        return;
      }

      const p1 = waypoints[waypoints.length - 2];
      const p2 = newPt;

      // 즉각 시각 연결 (대기 없이 즉시 반영)
      const directLine = [new kakao.maps.LatLng(p1.lat, p1.lng), new kakao.maps.LatLng(p2.lat, p2.lng)];
      routeSegments.push(directLine);
      renderAllPolylines();

      updateGpsStatus('routing', '등산로 경로 탐색 중...');

      // 오픈 등산로 엔진(OSRM footway) 정밀 조회
      const matchedTrail = await fetchOsmFootTrail(p1, p2);

      // 실제 등산로가 조회되면 해당 경로로 교체, 없으면 이탈 없는 직결선 유지
      if (matchedTrail && matchedTrail.length > 0) {
        routeSegments[routeSegments.length - 1] = matchedTrail;
        renderAllPolylines();
      }

      updateGpsStatus('gps-active', '실시간 GPS 수신 중');
      saveCourseToStorage();
    }

    // 오픈 등산로(OSRM Foot) 경로 조회 (아스팔트 우회 및 숲 횡단 방지)
    async function fetchOsmFootTrail(p1, p2) {
      const straightDist = getDistanceMeters(p1, p2);

      try {
        // 전 세계 보행로/등산로 전용 OSRM 공식 엔드포인트
        const url = `https://routing.openstreetmap.de/routed-foot/route/v1/driving/${p1.lng},${p1.lat};${p2.lng},${p2.lat}?overview=full&geometries=geojson`;
        const res = await fetch(url, { signal: AbortSignal.timeout(2200) });
        if (res.ok) {
          const data = await res.json();
          if (data.routes && data.routes[0]) {
            const routeDist = data.routes[0].distance;
            // 엉뚱한 아스팔트 차도로 빙빙 돌아가는 경우(1.7배 초과) 자동 필터링
            if (straightDist < 180 || routeDist / straightDist <= 1.7) {
              return data.routes[0].geometry.coordinates.map(c => new kakao.maps.LatLng(c[1], c[0]));
            }
          }
        }
      } catch (e) {}

      // 등산로 데이터가 없거나 연결이 끊긴 구간은
      // 숲속을 가로지르는 억지 곡선을 그리지 않고 정확한 직선으로 연결하여 이탈을 0%로 막음!
      return null;
    }

    function renderAllPolylines() {
      const fullPath = [];
      routeSegments.forEach((seg, idx) => {
        if (idx === 0) {
          fullPath.push(...seg);
        } else {
          fullPath.push(...seg.slice(1));
        }
      });

      polylineBg.setPath(fullPath);
      polylineMain.setPath(fullPath);

      const totalMeters = polylineMain.getLength();
      updateDashboard(totalMeters);
    }

    // 2. 보조 모드: 손가락으로 슥 그리기
    function setupDrawingEvents(container) {
      let activeDrawSegment = [];
      let lastDrawTime = 0;

      container.addEventListener('touchstart', function(e) {
        if (!isDrawMode || isHikeStarted) return;
        isDrawing = true;
        activeDrawSegment = [];
      }, { passive: true });

      container.addEventListener('touchmove', function(e) {
        if (!isDrawMode || !isDrawing || isHikeStarted) return;
        const now = Date.now();
        if (now - lastDrawTime < 60) return;
        lastDrawTime = now;

        const touch = e.touches[0];
        const rect = container.getBoundingClientRect();
        const point = new kakao.maps.Point(touch.clientX - rect.left, touch.clientY - rect.top);
        const latLng = map.getProjection().coordsFromContainerPoint(point);

        activeDrawSegment.push(latLng);
        polylineMain.setPath([...polylineMain.getPath(), latLng]);
      }, { passive: true });

      container.addEventListener('touchend', function() {
        if (!isDrawMode || !isDrawing || activeDrawSegment.length < 2) {
          isDrawing = false;
          return;
        }
        isDrawing = false;

        const startCoord = activeDrawSegment[0];
        const endCoord = activeDrawSegment[activeDrawSegment.length - 1];

        if (waypoints.length === 0) {
          waypoints.push({ lat: startCoord.getLat(), lng: startCoord.getLng() });
        }
        waypoints.push({ lat: endCoord.getLat(), lng: endCoord.getLng() });

        routeSegments.push(activeDrawSegment);
        renderAllPolylines();
        refreshPins();
        saveCourseToStorage();
      });
    }

    function toggleDrawMode() {
      if (isHikeStarted) return;
      isDrawMode = !isDrawMode;
      const btn = document.getElementById('btn-drawmode');
      const hint = document.getElementById('hint-text');

      if (isDrawMode) {
        btn.classList.add('draw-active');
        btn.innerText = "✋ 그리기 완료";
        map.setDraggable(false);
        hint.innerHTML = "✏️ <strong>등산로 선을 손가락으로 슥 따라 그려보세요!</strong>";
      } else {
        btn.classList.remove('draw-active');
        btn.innerText = "✏️ 길따라 그리기";
        map.setDraggable(true);
        hint.innerHTML = "등산로 꺾임목을 <strong>[콕콕 터치]</strong>하면 산길을 정밀하게 이어갑니다";
      }
    }

    // 3. 핀 및 대시보드 갱신
    function refreshPins() {
      pointOverlays.forEach(ov => ov.setMap(null));
      pointOverlays = [];

      const total = waypoints.length;
      if (total === 0) {
        document.getElementById('hint-text').innerHTML = "등산로 꺾임목을 <strong>[콕콕 터치]</strong>하면 산길을 정밀하게 이어갑니다";
        return;
      }

      waypoints.forEach((pt, idx) => {
        let isImportant = (idx === 0 || idx === total - 1 || total <= 5);
        if (isImportant) {
          let title = '';
          let className = 'course-pin ';

          if (idx === 0) {
            title = '🚩 출발';
            className += 'pin-start';
          } else if (idx === total - 1) {
            title = '🏁 도착';
            className += 'pin-end';
          } else {
            title = `📍 ${idx}`;
            className += 'pin-via';
          }

          const div = document.createElement('div');
          div.className = className;
          div.innerText = title;

          const overlay = new kakao.maps.CustomOverlay({
            position: new kakao.maps.LatLng(pt.lat, pt.lng),
            content: div,
            yAnchor: 1.25,
            zIndex: 10
          });
          overlay.setMap(map);
          pointOverlays.push(overlay);
        }
      });
    }

    function undoLastPoint() {
      if (waypoints.length === 0) return;
      waypoints.pop();
      if (routeSegments.length > 0) {
        routeSegments.pop();
      }
      renderAllPolylines();
      refreshPins();
      saveCourseToStorage();
    }

    function resetCourse() {
      if (!confirm("작성 중인 등산 코스를 초기화하시겠습니까?")) return;
      waypoints = [];
      routeSegments = [];
      polylineBg.setPath([]);
      polylineMain.setPath([]);
      refreshPins();
      updateDashboard(0);
      localStorage.removeItem(STORAGE_KEY);
      isHikeStarted = false;
      document.getElementById('btn-main').classList.remove('tracking');
      document.getElementById('btn-main').innerText = "🚀 코스 확정 & 실시간 산행 시작";
      if (isDrawMode) toggleDrawMode();
    }

    function updateDashboard(meters) {
      if (meters <= 0) {
        document.getElementById('total-dist').innerText = "0.00";
        document.getElementById('total-time').innerText = "0";
        document.getElementById('eta-time').innerText = "--:--";
        return;
      }

      const km = meters / 1000;
      document.getElementById('total-dist').innerText = km.toFixed(2);

      const minutes = Math.round((km / 2.5) * 60);
      document.getElementById('total-time').innerText = minutes;

      const eta = new Date(Date.now() + minutes * 60000);
      const h = String(eta.getHours()).padStart(2, '0');
      const m = String(eta.getMinutes()).padStart(2, '0');
      document.getElementById('eta-time').innerText = `${h}:${m}`;
    }

    function getDistanceMeters(p1, p2) {
      const R = 6371e3;
      const φ1 = p1.lat * Math.PI / 180;
      const φ2 = p2.lat * Math.PI / 180;
      const Δφ = (p2.lat - p1.lat) * Math.PI / 180;
      const Δλ = (p2.lng - p1.lng) * Math.PI / 180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // 4. GPS 감시
    function startGpsWatch() {
      if (!navigator.geolocation) {
        updateGpsStatus('gps-lost', 'GPS 미지원');
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        function(position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const userLatLng = new kakao.maps.LatLng(lat, lng);

          lastUserLocation = { lat, lng };
          lastGpsTimestamp = Date.now();

          renderUserLocation(userLatLng);
          updateGpsStatus('gps-active', '실시간 GPS 수신 중');

          if (isFollowUser && map) {
            map.panTo(userLatLng);
          }
        },
        function(error) {
          const timeSince = Date.now() - lastGpsTimestamp;
          if (lastUserLocation && timeSince < 600000) {
            updateGpsStatus('gps-lost', '산악 음영 (추정 유지)');
          } else {
            updateGpsStatus('gps-lost', 'GPS 신호 없음');
          }
        },
        { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
      );
    }

    function renderUserLocation(latLng) {
      if (!userMarkerOverlay) {
        const markerDiv = document.createElement('div');
        markerDiv.className = 'user-location-marker';
        userMarkerOverlay = new kakao.maps.CustomOverlay({
          position: latLng,
          content: markerDiv,
          xAnchor: 0.5,
          yAnchor: 0.5,
          zIndex: 30
        });
        userMarkerOverlay.setMap(map);
      } else {
        userMarkerOverlay.setPosition(latLng);
      }
    }

    function updateGpsStatus(statusClass, text) {
      const badge = document.getElementById('gps-status');
      const label = document.getElementById('gps-status-text');
      badge.className = `status-badge ${statusClass}`;
      label.innerText = text;
    }

    function toggleLiveTracking() {
      if (!lastUserLocation) {
        alert("현재 내 위치 GPS 신호를 수신 중입니다. 잠시 후 눌러주세요.");
        return;
      }
      isFollowUser = !isFollowUser;
      const btn = document.getElementById('btn-curpos');

      if (isFollowUser) {
        btn.classList.add('active');
        map.panTo(new kakao.maps.LatLng(lastUserLocation.lat, lastUserLocation.lng));
      } else {
        btn.classList.remove('active');
      }
    }

    function toggleHikeMode() {
      if (waypoints.length < 2) {
        alert("출발지와 도착지 최소 2곳 이상을 지정해 주세요.");
        return;
      }

      isHikeStarted = !isHikeStarted;
      const btn = document.getElementById('btn-main');
      const hint = document.getElementById('hint-text');

      if (isHikeStarted) {
        if (isDrawMode) toggleDrawMode();
        btn.classList.add('tracking');
        btn.innerText = "🛑 산행 진행 중 (터치 시 종료)";
        hint.innerHTML = "🥾 <strong>실시간 산행 중</strong> (안전 산행 되세요)";
        isFollowUser = true;
        document.getElementById('btn-curpos').classList.add('active');
        if (lastUserLocation) map.panTo(new kakao.maps.LatLng(lastUserLocation.lat, lastUserLocation.lng));
      } else {
        btn.classList.remove('tracking');
        btn.innerText = "🚀 코스 확정 & 실시간 산행 시작";
        hint.innerHTML = "산행이 종료되었습니다. 코스를 새로 수정하거나 초기화할 수 있습니다.";
      }
    }

    function toggleSkyview() {
      if (!map) return;
      const btn = document.getElementById('btn-skyview');
      isSkyview = !isSkyview;
      if (isSkyview) {
        map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);
        btn.classList.add('active');
      } else {
        map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP);
        btn.classList.remove('active');
      }
    }

    function toggleTerrain() {
      if (!map) return;
      const btn = document.getElementById('btn-terrain');
      isTerrain = !isTerrain;
      if (isTerrain) {
        map.addOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
        btn.classList.add('active');
      } else {
        map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
        btn.classList.remove('active');
      }
    }

    function saveCourseToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        waypoints: waypoints,
        segments: routeSegments.map(seg => seg.map(coord => ({ lat: coord.getLat(), lng: coord.getLng() })))
      }));
    }

    function restoreCachedCourse() {
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          if (parsed && parsed.waypoints && parsed.waypoints.length > 0) {
            waypoints = parsed.waypoints;
            routeSegments = (parsed.segments || []).map(seg => seg.map(c => new kakao.maps.LatLng(c.lat, c.lng)));
            renderAllPolylines();
            refreshPins();
          }
        } catch (e) {}
      }
    }
  </script>
