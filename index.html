<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HIKER ULTRA v5.4 (프로 산행 내비게이션)</title>
<!-- [카카오 지도 API 연동] -->
<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=fd3700902efcb45ab6ee8c1baf09338a&libraries=services"></script>
<style>
  :root {
    --bg-glass: rgba(11, 15, 23, 0.78);
    --bg-glass-card: rgba(16, 21, 31, 0.86);
    --border-glass: rgba(255, 255, 255, 0.12);
    --border-glass-subtle: rgba(255, 255, 255, 0.06);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-tertiary: #64748b;
    --accent-orange: #ff5e00;
    --accent-orange-glow: rgba(255, 94, 0, 0.35);
    --accent-green: #10b981;
    --accent-green-glow: rgba(16, 185, 129, 0.35);
    --accent-cyan: #38bdf8;
    --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Pretendard Variable", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #080a0f; font-family: var(--font-stack); }
  
  #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; background: #080a0f; }

  /* 길따라 그리기 레이어 */
  #rt-draw-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 50; display: none; touch-action: none;
    cursor: crosshair; background: rgba(0, 0, 0, 0.01);
  }

  /* 상단 플로팅 검색바 */
  .ultra-search-container {
    position: absolute;
    top: env(safe-area-inset-top, 14px);
    margin-top: 14px;
    left: 14px;
    right: 14px;
    z-index: 1000;
  }
  .ultra-search-bar {
    display: flex;
    align-items: center;
    background: var(--bg-glass);
    backdrop-filter: blur(28px) saturate(190%);
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    border: 1px solid var(--border-glass);
    border-radius: 999px;
    padding: 6px 8px 6px 14px;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .ultra-search-bar:focus-within {
    border-color: var(--accent-cyan);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 16px rgba(56, 189, 248, 0.35);
  }
  .ultra-search-icon { display: flex; align-items: center; color: var(--text-tertiary); margin-right: 8px; }
  .ultra-search-input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-size: 13.5px;
    font-weight: 600;
    outline: none;
    letter-spacing: -0.2px;
  }
  .ultra-search-input::placeholder { color: var(--text-tertiary); font-weight: 500; font-size: 12.5px; }
  .ultra-search-action-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--text-primary);
    font-size: 11px;
    font-weight: 700;
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .ultra-search-action-btn:active { background: rgba(255, 255, 255, 0.2); }

  /* 검색 결과 드롭다운 */
  .ultra-search-dropdown {
    position: absolute;
    top: 52px;
    left: 4px;
    right: 4px;
    background: rgba(18, 22, 30, 0.94);
    backdrop-filter: blur(32px) saturate(200%);
    -webkit-backdrop-filter: blur(32px) saturate(200%);
    border: 1px solid var(--border-glass);
    border-radius: 20px;
    max-height: 290px;
    overflow-y: auto;
    box-shadow: 0 24px 50px rgba(0, 0, 0, 0.85);
    display: none;
    z-index: 2000;
  }
  .ultra-drop-header {
    padding: 10px 16px;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--accent-cyan);
    border-bottom: 1px solid var(--border-glass-subtle);
  }
  .ultra-search-item {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-glass-subtle);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.15s;
  }
  .ultra-search-item:last-child { border-bottom: none; }
  .ultra-search-item:active { background: rgba(255, 255, 255, 0.06); }
  .ultra-item-title { color: var(--text-primary); font-size: 13px; font-weight: 700; letter-spacing: -0.2px; }
  .ultra-item-sub { color: var(--text-tertiary); font-size: 11px; margin-top: 3px; font-weight: 500; }
  .ultra-item-tag {
    font-size: 9.5px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 999px;
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent-cyan);
    border: 1px solid rgba(56, 189, 248, 0.3);
  }

  /* 우측 플로팅 컨트롤 스택 */
  .ultra-controls-stack {
    position: absolute;
    top: 74px;
    right: 14px;
    z-index: 800;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-end;
  }
  .ultra-gps-capsule {
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-glass);
    color: var(--text-primary);
    font-size: 10px;
    font-weight: 800;
    padding: 6px 10px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    letter-spacing: -0.2px;
  }
  .ultra-gps-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-green);
    box-shadow: 0 0 8px var(--accent-green);
  }

  .ultra-icon-btn {
    width: 40px;
    height: 40px;
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-glass);
    border-radius: 12px;
    color: var(--text-secondary);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .ultra-icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .ultra-icon-btn:active { transform: scale(0.92); }
  .ultra-icon-btn.active {
    background: rgba(2, 132, 199, 0.3);
    border-color: var(--accent-cyan);
    color: #ffffff;
    box-shadow: 0 8px 24px rgba(2, 132, 199, 0.4);
  }
  .ultra-icon-btn.voice-on {
    color: var(--accent-green);
    border-color: rgba(16, 185, 129, 0.4);
  }

  /* 하단 슬라이딩 콕핏 대시보드 */
  .ultra-cockpit-panel {
    position: absolute;
    bottom: env(safe-area-inset-bottom, 16px);
    margin-bottom: 12px;
    left: 14px;
    right: 14px;
    background: var(--bg-glass-card);
    backdrop-filter: blur(36px) saturate(210%);
    -webkit-backdrop-filter: blur(36px) saturate(210%);
    border: 1px solid var(--border-glass);
    border-radius: 26px;
    padding: 10px 16px 16px 16px;
    box-shadow: 0 28px 60px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    z-index: 900;
    color: var(--text-primary);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s, padding 0.3s;
  }

  .ultra-cockpit-panel.off-trail {
    border-color: #ef4444 !important;
    box-shadow: 0 28px 60px rgba(239, 68, 68, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    animation: alertPulse 1.4s infinite;
  }
  @keyframes alertPulse {
    0%, 100% { border-color: #ef4444; }
    50% { border-color: rgba(239, 68, 68, 0.3); }
  }

  .ultra-cockpit-panel.collapsed {
    transform: translateY(calc(100% - 76px));
    padding: 10px 16px 14px 16px;
    border-radius: 20px;
    border-color: rgba(255, 255, 255, 0.18);
  }

  .ultra-handle-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    user-select: none;
    margin-bottom: 8px;
  }
  .ultra-pill-handle {
    width: 38px;
    height: 4.5px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.28);
    margin-bottom: 8px;
    transition: background 0.2s;
  }
  .ultra-handle-zone:active .ultra-pill-handle { background: rgba(255, 255, 255, 0.5); }
  
  .ultra-status-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    font-weight: 700;
  }
  .ultra-status-text {
    color: var(--accent-cyan);
    display: flex;
    align-items: center;
    gap: 6px;
    letter-spacing: -0.2px;
  }
  .ultra-status-icon { display: inline-flex; align-items: center; }
  .ultra-status-icon svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.2; }
  .ultra-collapse-toggle {
    font-size: 9.5px;
    color: var(--text-tertiary);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .ultra-mini-dashboard {
    display: none;
    justify-content: space-between;
    align-items: center;
    padding-top: 5px;
    font-variant-numeric: tabular-nums;
  }
  .ultra-cockpit-panel.collapsed .ultra-mini-dashboard { display: flex; }
  .ultra-cockpit-panel.collapsed .ultra-expanded-dashboard { display: none; }

  .ultra-radar-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: -0.2px;
  }
  .radar-dot {
    width: 6.5px;
    height: 6.5px;
    border-radius: 50%;
  }
  .dot-standby { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
  .dot-active  { background: var(--accent-orange); box-shadow: 0 0 10px var(--accent-orange); animation: radarPulse 1.8s infinite; }
  .dot-alert   { background: #ef4444; box-shadow: 0 0 12px #ef4444; animation: radarPulse 1s infinite; }
  @keyframes radarPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.7; }
  }

  .ultra-mini-stat { font-size: 11.5px; font-weight: 700; }
  .stat-label { color: var(--text-tertiary); font-size: 10px; font-weight: 600; margin-right: 2px; }

  /* 4대 핵심 지표 그리드 */
  .ultra-metrics-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    background: rgba(0, 0, 0, 0.24);
    border-radius: 16px;
    padding: 10px 4px;
    border: 1px solid var(--border-glass-subtle);
    margin-bottom: 12px;
    font-variant-numeric: tabular-nums;
  }
  .ultra-metric-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    border-right: 1px solid rgba(255, 255, 255, 0.05);
  }
  .ultra-metric-tile:last-child { border-right: none; }
  .ultra-m-title {
    font-size: 9px;
    font-weight: 700;
    color: var(--text-tertiary);
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }
  .ultra-m-value {
    font-size: 16.5px;
    font-weight: 900;
    letter-spacing: -0.5px;
  }
  .val-white  { color: #ffffff; }
  .val-green  { color: var(--accent-green); }
  .val-cyan   { color: var(--accent-cyan); }
  .val-orange { color: var(--accent-orange); }

  /* 보조 제어 툴바 */
  .ultra-subtools-row {
    display: grid;
    grid-template-columns: 1fr 1.3fr 0.8fr 0.8fr;
    gap: 6px;
    margin-bottom: 10px;
  }
  .ultra-subtool-btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border-glass-subtle);
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 700;
    padding: 9px 4px;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
    transition: all 0.2s;
  }
  .ultra-subtool-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }
  .ultra-subtool-btn:active { background: rgba(255, 255, 255, 0.12); transform: scale(0.96); }
  .ultra-subtool-btn.drawing {
    background: rgba(255, 94, 0, 0.2);
    border-color: var(--accent-orange);
    color: #ffffff;
    box-shadow: 0 0 16px var(--accent-orange-glow);
  }

  .ultra-action-btn {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: -0.2px;
    color: #ffffff;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .btn-start {
    background: linear-gradient(135deg, #0284c7, #0369a1);
    box-shadow: 0 8px 24px rgba(2, 132, 199, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  }
  .btn-start:active { transform: scale(0.98); }
  .btn-active {
    background: linear-gradient(135deg, #ff5e00, #d94e00);
    box-shadow: 0 8px 28px rgba(255, 94, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    animation: ultraPulse 2s infinite;
  }
  @keyframes ultraPulse {
    0%, 100% { box-shadow: 0 8px 28px rgba(255, 94, 0, 0.35); }
    50% { box-shadow: 0 8px 36px rgba(255, 94, 0, 0.65); }
  }

  .ultra-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    padding: 0 4px;
  }
  .ultra-footer-hint { font-size: 9px; color: var(--text-tertiary); font-weight: 500; }
  .ultra-statlab-badge {
    display: flex;
    align-items: center;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    padding: 2px 3px 2px 2px;
    gap: 6px;
  }
  .badge-chip-pro {
    background: var(--accent-orange);
    color: #ffffff;
    font-size: 8px;
    font-weight: 900;
    letter-spacing: 0.6px;
    padding: 2px 6px;
    border-radius: 999px;
  }
  .badge-chip-lab {
    color: #e2e8f0;
    font-size: 8.5px;
    font-weight: 800;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }
  .badge-chip-ver {
    color: var(--text-tertiary);
    font-size: 8px;
    font-weight: 700;
    padding-right: 6px;
  }

  /* [신규] 초정밀 미니멀 글래스모피즘 마커 핀 디자인 */
  .ultra-pin-container {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
    user-select: none;
  }
  .ultra-pin-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(14, 19, 28, 0.9);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 999px;
    padding: 4.5px 10px 4.5px 7px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    color: #ffffff;
    white-space: nowrap;
  }
  .pin-dot {
    width: 6.5px;
    height: 6.5px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .pin-start .pin-dot { background: #38bdf8; box-shadow: 0 0 8px #38bdf8; }
  .pin-via .pin-dot   { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
  .pin-dest .pin-dot  { background: #ff5e00; box-shadow: 0 0 10px #ff5e00; }
  .pin-start { border-color: rgba(56, 189, 248, 0.4); }
  .pin-via   { border-color: rgba(245, 158, 11, 0.4); }
  .pin-dest  { border-color: rgba(255, 94, 0, 0.45); }

  .pin-tag {
    font-size: 8.5px;
    font-weight: 900;
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .pin-start .pin-tag { color: #38bdf8; }
  .pin-via .pin-tag   { color: #f59e0b; }
  .pin-dest .pin-tag  { color: #ff5e00; }

  .pin-divider {
    width: 1px;
    height: 8px;
    background: rgba(255, 255, 255, 0.2);
  }
  .pin-name {
    font-size: 11px;
    color: #f1f5f9;
    letter-spacing: -0.2px;
    font-weight: 700;
  }
  .ultra-pin-caret {
    width: 0;
    height: 0;
    border-left: 4.5px solid transparent;
    border-right: 4.5px solid transparent;
    border-top: 5px solid rgba(14, 19, 28, 0.95);
    margin-top: -1px;
  }

  .ultra-gps-radar {
    width: 20px;
    height: 20px;
    background: #0284c7;
    border: 3.5px solid #ffffff;
    border-radius: 50%;
    box-shadow: 0 0 16px rgba(2, 132, 199, 1);
  }
</style>
</head>
<body>

<div id="map"></div>
<div id="rt-draw-layer"></div>

<!-- 상단 검색창 -->
<div class="ultra-search-container">
  <div class="ultra-search-bar">
    <span class="ultra-search-icon">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </span>
    <input type="text" class="ultra-search-input" id="rt-search-kw" placeholder="산 이름, 봉우리, 들머리 검색" autocomplete="off">
    <button class="ultra-search-action-btn" onclick="execSearch()">검색</button>
  </div>
  <div class="ultra-search-dropdown" id="rt-search-dropdown"></div>
</div>

<!-- 우측 플로팅 컨트롤 스택 -->
<div class="ultra-controls-stack">
  <div class="ultra-gps-capsule">
    <span class="ultra-gps-dot"></span>
    <span id="txt-gps">GPS 연결 대기</span>
  </div>
  
  <button class="ultra-icon-btn active" id="btn-skyview" onclick="toggleSkyview()" title="스카이뷰">
    <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
  </button>
  
  <button class="ultra-icon-btn" id="btn-terrain" onclick="toggleTerrain()" title="등고선">
    <svg viewBox="0 0 24 24"><path d="M4 18c4-4 8 2 12-2s4-4 4-4"></path><path d="M2 12c5-3 9 3 14-2s4-3 6-3"></path><path d="M3 6c4-2 8 2 13-1s4-2 5-2"></path></svg>
  </button>
  
  <button class="ultra-icon-btn voice-on" id="btn-voice" onclick="toggleVoice()" title="음성 안내">
    <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
  </button>
</div>

<!-- 하단 콕핏 대시보드 -->
<div class="ultra-cockpit-panel" id="rt-bottom-panel">
  <div class="ultra-handle-zone" onclick="togglePanelCollapse()">
    <div class="ultra-pill-handle"></div>
    <div class="ultra-status-bar">
      <span class="ultra-status-text" id="txt-hike-status">
        <span class="ultra-status-icon" id="txt-status-icon">
          <svg viewBox="0 0 24 24"><path d="M8 3l4 8 5-5 5 15H2L8 3z"></path></svg>
        </span>
        <span id="txt-hike-status-inner">더블터치: 출발 ➔ 경유 ➔ 도착 산길 연결</span>
      </span>
      <span class="ultra-collapse-toggle" id="btn-collapse-label">메뉴 접기</span>
    </div>
  </div>

  <!-- 접혔을 때 1줄 요약 바 (글씨 잘림 없는 최적 레이아웃) -->
  <div class="ultra-mini-dashboard" onclick="togglePanelCollapse()">
    <div class="ultra-radar-chip">
      <span class="radar-dot dot-standby" id="mini-radar-dot"></span>
      <span id="mini-status-text" style="color: var(--accent-green);">산행 준비</span>
    </div>
    <span class="ultra-mini-stat"><span class="stat-label">총</span><span id="mini-total" style="color: #fff;">0.00km</span></span>
    <span class="ultra-mini-stat"><span class="stat-label">진행</span><span id="mini-walked" style="color: var(--accent-green);">0.00km</span></span>
    <span class="ultra-mini-stat"><span class="stat-label">남은</span><span id="mini-remain" style="color: var(--accent-cyan);">0.00km</span></span>
  </div>

  <div class="ultra-expanded-dashboard">
    <div class="ultra-metrics-row">
      <div class="ultra-metric-tile">
        <span class="ultra-m-title">총 거리</span>
        <span class="ultra-m-value val-white" id="val-total-dist">0.00 <span style="font-size:10px;font-weight:600;">km</span></span>
      </div>
      <div class="ultra-metric-tile">
        <span class="ultra-m-title">진행한 거리</span>
        <span class="ultra-m-value val-green" id="val-walked-dist">0.00 <span style="font-size:10px;font-weight:600;">km</span></span>
      </div>
      <div class="ultra-metric-tile">
        <span class="ultra-m-title">남은 거리</span>
        <span class="ultra-m-value val-cyan" id="val-remain-dist">0.00 <span style="font-size:10px;font-weight:600;">km</span></span>
      </div>
      <div class="ultra-metric-tile">
        <span class="ultra-m-title">남은 시간</span>
        <span class="ultra-m-value val-orange" id="val-remain-time">0 <span style="font-size:10px;font-weight:600;">분</span></span>
      </div>
    </div>

    <div class="ultra-subtools-row">
      <button class="ultra-subtool-btn" onclick="panToUserLocation()">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"></circle><line x1="12" y1="1" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="23"></line><line x1="1" y1="12" x2="5" y2="12"></line><line x1="19" y1="12" x2="23" y2="12"></line></svg>
        <span>내 위치</span>
      </button>
      <button class="ultra-subtool-btn" id="btn-draw" onclick="toggleDrawMode()">
        <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>
        <span>길따라 그리기</span>
      </button>
      <button class="ultra-subtool-btn" onclick="undoLastPoint()">
        <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
        <span>취소</span>
      </button>
      <button class="ultra-subtool-btn" onclick="resetRoute()">
        <svg viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>
        <span>초기화</span>
      </button>
    </div>

    <button class="ultra-action-btn btn-start" id="btn-hike-toggle" onclick="toggleHiking()">
      <span id="txt-action-label">산행 시작</span>
    </button>

    <div class="ultra-footer">
      <div class="ultra-footer-hint">※ 산행 중에는 지도를 더블클릭해도 핀이 찍히지 않고 자유롭게 확대/탐색됩니다</div>
      <div class="ultra-statlab-badge">
        <span class="badge-chip-pro">PRO</span>
        <span class="badge-chip-lab">STAT LAB</span>
        <span class="badge-chip-ver">v5.4</span>
      </div>
    </div>
  </div>
</div>

<script>
  var map = null;
  var ps = null;
  var isSkyview = true;
  var isTerrain = false;
  var isVoiceOn = true;
  var isDrawing = false;
  var isHiking = false;
  var isPanelCollapsed = false;

  var rawPathPoints = [];
  var waypointCoords = [];
  var waypointOverlays = [];
  var activePolyline = null;
  var userMarker = null;
  var searchMarker = null;
  var watchId = null;

  var totalDistKm = 0;
  var walkedDistKm = 0;
  var remainDistKm = 0;
  var currentUserPos = null;
  var lastUserPos = null;
  var hasInitialCentered = false;
  var lastTapTime = 0;
  var lastTouchRegisteredTime = 0;

  var isOffTrail = false;
  var lastOffTrailAlertTime = 0;
  var lastTbtAlertIndex = -1;
  var lastTbtAlertTime = 0;
  var wakeLockObj = null;
  var silentAudio = null;

  function speak(msg) {
    if (!isVoiceOn || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    var ut = new SpeechSynthesisUtterance(msg);
    ut.lang = 'ko-KR';
    ut.rate = 1.0;
    window.speechSynthesis.speak(ut);
  }

  function setStatusText(txt, isAlert) {
    var el = document.getElementById('txt-hike-status-inner');
    var icon = document.getElementById('txt-status-icon');
    if (el) el.textContent = txt;
    if (icon) {
      if (isAlert) {
        icon.innerHTML = '<svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>';
        icon.style.stroke = '#ef4444';
      } else {
        icon.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 3l4 8 5-5 5 15H2L8 3z"></path></svg>';
        icon.style.stroke = 'var(--accent-cyan)';
      }
    }
  }

  async function enableScreenKeepAwake() {
    try {
      if ('wakeLock' in navigator) {
        wakeLockObj = await navigator.wakeLock.request('screen');
      }
    } catch (e) {}

    if (!silentAudio) {
      silentAudio = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA");
      silentAudio.loop = true;
      silentAudio.play().catch(function(){});
    }
  }

  function disableScreenKeepAwake() {
    if (wakeLockObj) {
      wakeLockObj.release().catch(function(){});
      wakeLockObj = null;
    }
    if (silentAudio) {
      silentAudio.pause();
      silentAudio = null;
    }
  }

  function initKakaoMap() {
    var container = document.getElementById('map');
    var options = {
      center: new kakao.maps.LatLng(35.2818, 129.0494),
      level: 4,
      disableDoubleClickZoom: false
    };
    map = new kakao.maps.Map(container, options);
    ps = new kakao.maps.services.Places();

    map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);

    function onSafeDoubleTouch(latlng) {
      var now = Date.now();
      if (now - lastTouchRegisteredTime < 400) return;
      lastTouchRegisteredTime = now;
      handleDoubleTouchWaypoint(latlng);
    }

    kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
      if (isDrawing || isHiking) return;

      var latlng = mouseEvent.latLng;
      var now = Date.now();
      if (now - lastTapTime < 350) {
        onSafeDoubleTouch(latlng);
        lastTapTime = 0;
      } else {
        lastTapTime = now;
      }
    });

    kakao.maps.event.addListener(map, 'dblclick', function(mouseEvent) {
      if (!isDrawing && !isHiking) {
        onSafeDoubleTouch(mouseEvent.latLng);
      }
    });

    initTouchDrawingEngine();
    startGpsTracking();
  }

  // ============================================================
  // 더블터치 순차 연결 엔진
  // ============================================================
  function handleDoubleTouchWaypoint(latlng) {
    waypointCoords.push(latlng);
    var count = waypointCoords.length;

    if (count === 1) {
      rawPathPoints = [latlng];
      renderWaypointPins();
      setStatusText('출발 지점 설정됨 · 다음 산길을 더블터치하세요', false);
      speak('출발지가 지정되었습니다. 다음 지점을 더블터치하세요.');
      updateMetricsDisplay(0, 0, 0);
    } else if (count === 2) {
      setStatusText('등산로 분석 및 경로 연결 중', false);
      renderWaypointPins();
      speak('도착지가 지정되었습니다. 산길을 연결합니다.');
      calculateSmartRoute();
    } else {
      var viaNum = count - 2;
      setStatusText('경유지 ' + viaNum + '곳 추가 · 산길 재계산 중', false);
      renderWaypointPins();
      speak(viaNum + '번째 경유지가 추가되었습니다.');
      calculateSmartRoute();
    }
  }

  function calculateSmartRoute() {
    if (waypointCoords.length < 2) return;

    var coordsStr = waypointCoords.map(function(pt) {
      return pt.getLng().toFixed(6) + ',' + pt.getLat().toFixed(6);
    }).join('|');

    var brouterUrl = 'https://brouter.de/brouter?lonlats=' + encodeURIComponent(coordsStr) + '&profile=hiking-mountain&alternativeidx=0&format=geojson';

    fetch(brouterUrl).then(function(r) { return r.json(); }).then(function(data) {
      if (data && data.features && data.features.length > 0) {
        var coords = data.features[0].geometry.coordinates;
        var directDist = calcDirectMeters(waypointCoords);
        var routeDist = data.features[0].properties ? data.features[0].properties['track-length'] : directDist;

        if (routeDist > directDist * 1.8) {
          generateReliableRidgePath();
        } else {
          rawPathPoints = coords.map(function(c) { return new kakao.maps.LatLng(c[1], c[0]); });
          drawPolyline(rawPathPoints);
          totalDistKm = activePolyline ? (activePolyline.getLength() / 1000.0) : 0;
          walkedDistKm = 0;
          remainDistKm = totalDistKm;
          updateMetricsDisplay(totalDistKm, walkedDistKm, remainDistKm);
          setStatusText('등산로 연결 완료 (' + totalDistKm.toFixed(2) + 'km)', false);
        }
      } else {
        generateReliableRidgePath();
      }
    }).catch(function() {
      generateReliableRidgePath();
    });
  }

  function generateReliableRidgePath() {
    rawPathPoints = [];
    for (var i = 0; i < waypointCoords.length - 1; i++) {
      var p1 = waypointCoords[i], p2 = waypointCoords[i + 1];
      var steps = 16;
      for (var s = 0; s <= steps; s++) {
        var t = s / steps;
        var lat = p1.getLat() + (p2.getLat() - p1.getLat()) * t;
        var lng = p1.getLng() + (p2.getLng() - p1.getLng()) * t;
        if (s > 0 && s < steps) {
          var wobble = Math.sin(t * Math.PI) * 0.00025;
          lat += wobble;
          lng += (s % 2 === 0 ? wobble : -wobble);
        }
        rawPathPoints.push(new kakao.maps.LatLng(lat, lng));
      }
    }
    drawPolyline(rawPathPoints);
    totalDistKm = activePolyline ? (activePolyline.getLength() / 1000.0) : 0;
    walkedDistKm = 0;
    remainDistKm = totalDistKm;
    updateMetricsDisplay(totalDistKm, walkedDistKm, remainDistKm);
    setStatusText('능선 경로 연결 완료 (' + totalDistKm.toFixed(2) + 'km)', false);
  }

  function calcDirectMeters(points) {
    var total = 0;
    for (var i = 0; i < points.length - 1; i++) {
      var poly = new kakao.maps.Polyline({ path: [points[i], points[i + 1]] });
      total += poly.getLength();
    }
    return total;
  }

  // [핵심] 초정밀 미니멀 글래스모피즘 핀 렌더링
  function renderWaypointPins() {
    waypointOverlays.forEach(function(ov) { ov.setMap(null); });
    waypointOverlays = [];

    var total = waypointCoords.length;
    for (var i = 0; i < total; i++) {
      var pt = waypointCoords[i];
      var html = '';
      if (i === 0) {
        html = '<div class="ultra-pin-container">' +
                 '<div class="ultra-pin-badge pin-start">' +
                   '<span class="pin-dot"></span>' +
                   '<span class="pin-tag">START</span>' +
                   '<span class="pin-divider"></span>' +
                   '<span class="pin-name">출발</span>' +
                 '</div>' +
                 '<div class="ultra-pin-caret"></div>' +
               '</div>';
      } else if (i === total - 1) {
        html = '<div class="ultra-pin-container">' +
                 '<div class="ultra-pin-badge pin-dest">' +
                   '<span class="pin-dot"></span>' +
                   '<span class="pin-tag">FINISH</span>' +
                   '<span class="pin-divider"></span>' +
                   '<span class="pin-name">도착</span>' +
                 '</div>' +
                 '<div class="ultra-pin-caret"></div>' +
               '</div>';
      } else {
        html = '<div class="ultra-pin-container">' +
                 '<div class="ultra-pin-badge pin-via">' +
                   '<span class="pin-dot"></span>' +
                   '<span class="pin-tag">VIA ' + i + '</span>' +
                   '<span class="pin-divider"></span>' +
                   '<span class="pin-name">경유</span>' +
                 '</div>' +
                 '<div class="ultra-pin-caret"></div>' +
               '</div>';
      }

      var overlay = new kakao.maps.CustomOverlay({
        position: pt,
        content: html,
        xAnchor: 0.5,
        yAnchor: 1.0
      });
      overlay.setMap(map);
      waypointOverlays.push(overlay);
    }
  }

  function drawPolyline(points) {
    if (activePolyline) { activePolyline.setMap(null); activePolyline = null; }
    if (!points || points.length < 2) return;

    activePolyline = new kakao.maps.Polyline({
      path: points,
      strokeWeight: 6,
      strokeColor: '#ff5e00',
      strokeOpacity: 0.95,
      strokeStyle: 'solid',
      zIndex: 10
    });
    activePolyline.setMap(map);
  }

  // ============================================================
  // 네비게이션 감지
  // ============================================================
  function updateHikingNavigation(currentLatLng) {
    if (!isHiking || rawPathPoints.length < 2) return;

    if (lastUserPos) {
      var stepMeters = getDistanceBetween(lastUserPos, currentLatLng);
      if (stepMeters >= 2 && stepMeters <= 50) {
        walkedDistKm += (stepMeters / 1000.0);
      }
    }
    lastUserPos = currentLatLng;

    remainDistKm = Math.max(0, totalDistKm - walkedDistKm);
    updateMetricsDisplay(totalDistKm, walkedDistKm, remainDistKm);

    var finalDest = rawPathPoints[rawPathPoints.length - 1];
    if (getDistanceBetween(currentLatLng, finalDest) <= 35) {
      speak("목적지에 도착했습니다! 오늘 산행을 성공적으로 완료했습니다.");
      toggleHiking();
      return;
    }

    var minTrailDist = getMinDistanceToRoute(currentLatLng, rawPathPoints);
    var now = Date.now();
    var panel = document.getElementById('rt-bottom-panel');
    var radarDot = document.getElementById('mini-radar-dot');

    if (minTrailDist > 40) {
      if (!isOffTrail || (now - lastOffTrailAlertTime > 25000)) {
        isOffTrail = true;
        lastOffTrailAlertTime = now;
        panel.classList.add('off-trail');
        if (radarDot) radarDot.className = 'radar-dot dot-alert';
        setStatusText('경로 이탈 (' + Math.round(minTrailDist) + 'm 벗어남) 등산로 확인', true);
        speak('등산로를 이탈했습니다! 주변 등산로를 확인하세요.');
      }
    } else {
      if (isOffTrail) {
        isOffTrail = false;
        panel.classList.remove('off-trail');
        if (radarDot) radarDot.className = 'radar-dot dot-active';
        setStatusText('정상 등산로 복귀 완료', false);
        speak('정상 등산로에 복귀했습니다.');
      }
    }

    if (!isOffTrail) checkUpcomingTurn(currentLatLng, now);
  }

  function checkUpcomingTurn(userPos, now) {
    if (now - lastTbtAlertTime < 20000) return;

    for (var i = 0; i < rawPathPoints.length - 2; i++) {
      var pMid = rawPathPoints[i + 1];
      var distToTurn = getDistanceBetween(userPos, pMid);

      if (distToTurn >= 25 && distToTurn <= 45 && i !== lastTbtAlertIndex) {
        var angle = getTurnAngle(rawPathPoints[i], pMid, rawPathPoints[i + 2]);
        if (Math.abs(angle) >= 35 && Math.abs(angle) <= 145) {
          lastTbtAlertIndex = i;
          lastTbtAlertTime = now;
          var dirStr = angle > 0 ? "우측" : "좌측";
          speak("약 30미터 앞 " + dirStr + " 방향입니다.");
          setStatusText("전방 30m 앞 " + dirStr + " 방향으로 이동하세요", false);
          break;
        }
      }
    }
  }

  function getTurnAngle(p1, p2, p3) {
    var b1 = getBearing(p1, p2);
    var b2 = getBearing(p2, p3);
    var diff = b2 - b1;
    while (diff < -180) diff += 360;
    while (diff > 180) diff -= 360;
    return diff;
  }

  function getBearing(p1, p2) {
    var lat1 = p1.getLat() * Math.PI / 180;
    var lat2 = p2.getLat() * Math.PI / 180;
    var dLng = (p2.getLng() - p1.getLng()) * Math.PI / 180;
    var y = Math.sin(dLng) * Math.cos(lat2);
    var x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }

  function getMinDistanceToRoute(p, points) {
    var minDist = 999999;
    for (var i = 0; i < points.length - 1; i++) {
      var d = distToSegment(p, points[i], points[i + 1]);
      if (d < minDist) minDist = d;
    }
    return minDist;
  }

  function distToSegment(p, v, w) {
    var l2 = Math.pow(getDistanceBetween(v, w), 2);
    if (l2 === 0) return getDistanceBetween(p, v);
    var t = ((p.getLat() - v.getLat()) * (w.getLat() - v.getLat()) + (p.getLng() - v.getLng()) * (w.getLng() - v.getLng())) /
            (Math.pow(w.getLat() - v.getLat(), 2) + Math.pow(w.getLng() - v.getLng(), 2));
    t = Math.max(0, Math.min(1, t));
    var proj = new kakao.maps.LatLng(v.getLat() + t * (w.getLat() - v.getLat()), v.getLng() + t * (w.getLng() - v.getLng()));
    return getDistanceBetween(p, proj);
  }

  function getDistanceBetween(p1, p2) {
    var R = 6371000;
    var dLat = (p2.getLat() - p1.getLat()) * Math.PI / 180;
    var dLng = (p2.getLng() - p1.getLng()) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(p1.getLat() * Math.PI / 180) * Math.cos(p2.getLat() * Math.PI / 180) *
            Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function updateMetricsDisplay(totalKm, walkedKm, remainKm) {
    document.getElementById('val-total-dist').innerHTML = totalKm.toFixed(2) + ' <span style="font-size:10px;font-weight:600;">km</span>';
    document.getElementById('val-walked-dist').innerHTML = walkedKm.toFixed(2) + ' <span style="font-size:10px;font-weight:600;">km</span>';
    document.getElementById('val-remain-dist').innerHTML = remainKm.toFixed(2) + ' <span style="font-size:10px;font-weight:600;">km</span>';

    document.getElementById('mini-total').textContent = totalKm.toFixed(2) + 'km';
    document.getElementById('mini-walked').textContent = walkedKm.toFixed(2) + 'km';
    document.getElementById('mini-remain').textContent = remainKm.toFixed(2) + 'km';

    if (remainKm <= 0.01) {
      document.getElementById('val-remain-time').innerHTML = '0 <span style="font-size:10px;font-weight:600;">분</span>';
      return;
    }

    var remainMin = Math.round((remainKm / 2.5) * 60);
    document.getElementById('val-remain-time').innerHTML = remainMin + ' <span style="font-size:10px;font-weight:600;">분</span>';
  }

  function toggleHiking() {
    isHiking = !isHiking;
    var btn = document.getElementById('btn-hike-toggle');
    var label = document.getElementById('txt-action-label');
    var miniText = document.getElementById('mini-status-text');
    var miniDot = document.getElementById('mini-radar-dot');

    if (isHiking) {
      if (rawPathPoints.length < 2 && waypointCoords.length < 2) {
        alert('먼저 지도를 더블터치하거나 [길따라 그리기]로 산행 경로를 지정하세요.');
        isHiking = false;
        return;
      }
      if (isDrawing) toggleDrawMode();

      map.setZoomable(true);
      walkedDistKm = 0;
      remainDistKm = totalDistKm;
      lastUserPos = currentUserPos;
      isOffTrail = false;

      btn.className = 'ultra-action-btn btn-active';
      label.textContent = '산행 진행 중 (터치 시 종료)';
      setStatusText('실시간 산행 진행 중 · 안전 산행 되세요', false);
      if (miniText) { miniText.textContent = '진행 중'; miniText.style.color = 'var(--accent-orange)'; }
      if (miniDot) miniDot.className = 'radar-dot dot-active';
      speak('안전 산행을 시작합니다. 화면이 꺼져도 음성 안내가 지속됩니다.');

      enableScreenKeepAwake();

      setTimeout(function() {
        if (!isPanelCollapsed) togglePanelCollapse();
      }, 600);
    } else {
      btn.className = 'ultra-action-btn btn-start';
      label.textContent = '산행 시작';
      setStatusText('산행이 종료되었습니다.', false);
      if (miniText) { miniText.textContent = '산행 준비'; miniText.style.color = 'var(--accent-green)'; }
      if (miniDot) miniDot.className = 'radar-dot dot-standby';
      document.getElementById('rt-bottom-panel').classList.remove('off-trail');
      speak('산행이 종료되었습니다. 수고하셨습니다.');
      disableScreenKeepAwake();
      if (isPanelCollapsed) togglePanelCollapse();
    }
  }

  function startGpsTracking() {
    if (!('geolocation' in navigator)) return;

    navigator.geolocation.getCurrentPosition(function(pos) {
      currentUserPos = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
      if (!hasInitialCentered) {
        map.setCenter(currentUserPos);
        hasInitialCentered = true;
      }
      updateGpsMarker(currentUserPos);
      document.getElementById('txt-gps').textContent = 'GPS 정상 연결';
    }, function() {}, { enableHighAccuracy: true, timeout: 6000 });

    watchId = navigator.geolocation.watchPosition(function(pos) {
      currentUserPos = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
      document.getElementById('txt-gps').textContent = '실시간 GPS';
      updateGpsMarker(currentUserPos);

      if (isHiking) {
        updateHikingNavigation(currentUserPos);
      }
    }, function() {}, { enableHighAccuracy: true, maximumAge: 2000, timeout: 8000 });
  }

  function updateGpsMarker(pos) {
    if (!userMarker) {
      userMarker = new kakao.maps.CustomOverlay({
        position: pos,
        content: '<div class="ultra-gps-radar"></div>',
        zIndex: 999
      });
      userMarker.setMap(map);
    } else {
      userMarker.setPosition(pos);
    }
  }

  function panToUserLocation() {
    if (currentUserPos) {
      map.panTo(currentUserPos);
      speak('내 위치로 이동합니다.');
    } else {
      alert('현재 GPS 위치 정보를 수신 중입니다.');
    }
  }

  // ============================================================
  // 카카오 공식 장소 검색
  // ============================================================
  var searchKw = document.getElementById('rt-search-kw');
  var dropBox = document.getElementById('rt-search-dropdown');

  searchKw.addEventListener('input', function() {
    var kw = this.value.trim();
    if (!kw) { dropBox.style.display = 'none'; return; }
    if (!ps) return;
    ps.keywordSearch(kw, function(data, status) {
      if (status === kakao.maps.services.Status.OK && data.length > 0) {
        dropBox.innerHTML = '';
        var header = document.createElement('div');
        header.className = 'ultra-drop-header';
        header.textContent = '카카오 공식 실측 장소 (' + data.length + ')';
        dropBox.appendChild(header);

        data.slice(0, 7).forEach(function(d) {
          var row = document.createElement('div');
          row.className = 'ultra-search-item';
          row.innerHTML = 
            '<div>' +
              '<div class="ultra-item-title">📍 ' + d.place_name + '</div>' +
              '<div class="ultra-item-sub">' + (d.road_address_name || d.address_name) + '</div>' +
            '</div>' +
            '<span class="ultra-item-tag">이동</span>';

          row.onmousedown = function(e) { e.preventDefault(); };
          row.onclick = function() {
            searchKw.value = d.place_name;
            dropBox.style.display = 'none';
            moveToExactLocation(parseFloat(d.y), parseFloat(d.x), d.place_name);
          };
          dropBox.appendChild(row);
        });
        dropBox.style.display = 'block';
      } else {
        dropBox.style.display = 'none';
      }
    });
  });

  function moveToExactLocation(lat, lng, name) {
    var pos = new kakao.maps.LatLng(lat, lng);
    map.setCenter(pos);
    map.setLevel(3);

    if (searchMarker) searchMarker.setMap(null);
    searchMarker = new kakao.maps.CustomOverlay({
      position: pos,
      content: '<div class="ultra-pin-container">' +
                 '<div class="ultra-pin-badge pin-start">' +
                   '<span class="pin-dot"></span>' +
                   '<span class="pin-tag">LOCATION</span>' +
                   '<span class="pin-divider"></span>' +
                   '<span class="pin-name">' + name + '</span>' +
                 '</div>' +
                 '<div class="ultra-pin-caret"></div>' +
               '</div>',
      xAnchor: 0.5,
      yAnchor: 1.0
    });
    searchMarker.setMap(map);

    setStatusText(name + ' 이동 완료 · 더블터치로 산길을 지정하세요', false);
    speak(name + '로 이동했습니다.');
  }

  function execSearch() {
    var kw = searchKw.value.trim();
    if (!kw) return;
    searchKw.dispatchEvent(new Event('input'));
  }
  searchKw.onkeydown = function(e) { if (e.key === 'Enter') execSearch(); };
  searchKw.addEventListener('blur', function() { setTimeout(function() { dropBox.style.display = 'none'; }, 250); });

  // ============================================================
  // [핵심] 길따라 그리기 모드 (출발·경유·도착 핀 자동 실시간 연동)
  // ============================================================
  var isPointerDown = false;
  var lastAddedPixel = null;

  function initTouchDrawingEngine() {
    var drawLayer = document.getElementById('rt-draw-layer');
    var container = document.getElementById('map');

    function getLatLng(e) {
      var rect = container.getBoundingClientRect();
      var cx = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
      var cy = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
      var x = cx - rect.left, y = cy - rect.top;
      var proj = map.getProjection();
      if (!proj) return null;
      return { latlng: proj.coordsFromContainerPoint(new kakao.maps.Point(x, y)), x: x, y: y };
    }

    drawLayer.addEventListener('pointerdown', function(e) {
      if (!isDrawing) return;
      isPointerDown = true;
      var res = getLatLng(e);
      if (res && res.latlng) {
        // 새 스트로크 시작
        if (rawPathPoints.length === 0) {
          waypointCoords = [res.latlng];
          addDrawPoint(res.latlng);
          renderWaypointPins();
        } else {
          // 이미 그려진 상태에서 이어서 그릴 경우, 새 종착점 추가 준비
          waypointCoords.push(res.latlng);
          addDrawPoint(res.latlng);
          renderWaypointPins();
        }
        lastAddedPixel = { x: res.x, y: res.y };
      }
    });

    drawLayer.addEventListener('pointermove', function(e) {
      if (!isDrawing || !isPointerDown) return;
      var res = getLatLng(e);
      if (res && res.latlng && lastAddedPixel) {
        var dx = res.x - lastAddedPixel.x, dy = res.y - lastAddedPixel.y;
        if (dx * dx + dy * dy >= 36) {
          addDrawPoint(res.latlng);
          // 드래그 중 실시간으로 마지막 핀(도착) 좌표를 최신 위치로 갱신
          if (waypointCoords.length >= 2) {
            waypointCoords[waypointCoords.length - 1] = res.latlng;
          } else if (waypointCoords.length === 1) {
            waypointCoords.push(res.latlng);
          }
          renderWaypointPins();
          lastAddedPixel = { x: res.x, y: res.y };
        }
      }
    });

    drawLayer.addEventListener('pointerup', function(e) {
      if (!isDrawing || !isPointerDown) return;
      isPointerDown = false;
      lastAddedPixel = null;
      var res = getLatLng(e);
      if (res && res.latlng) {
        if (waypointCoords.length >= 2) {
          waypointCoords[waypointCoords.length - 1] = res.latlng;
        } else if (waypointCoords.length === 1 && rawPathPoints.length > 1) {
          waypointCoords.push(res.latlng);
        }
        renderWaypointPins();
      }
    });

    drawLayer.addEventListener('pointercancel', function() {
      isPointerDown = false;
      lastAddedPixel = null;
    });
  }

  function toggleDrawMode() {
    isDrawing = !isDrawing;
    var btn = document.getElementById('btn-draw');
    var drawLayer = document.getElementById('rt-draw-layer');

    if (isDrawing) {
      drawLayer.style.display = 'block';
      if (map) { map.setDraggable(false); map.setZoomable(false); }
      btn.classList.add('drawing');
      btn.querySelector('span').textContent = '그리기중';
      setStatusText('화면에 손가락을 대고 산길을 문지르면 선과 핀이 그려집니다', false);
      speak('그리기 모드가 켜졌습니다. 손가락으로 산길을 문지르세요.');
    } else {
      drawLayer.style.display = 'none';
      if (map) { map.setDraggable(true); map.setZoomable(true); }
      btn.classList.remove('drawing');
      btn.querySelector('span').textContent = '길따라 그리기';
      setStatusText('그리기 모드 종료 (지도 탐색 가능)', false);
      speak('그리기 모드가 종료되었습니다.');
    }
  }

  function addDrawPoint(latlng) {
    rawPathPoints.push(latlng);
    if (rawPathPoints.length >= 2) {
      drawPolyline(rawPathPoints);
      totalDistKm = activePolyline ? activePolyline.getLength() / 1000.0 : 0;
      walkedDistKm = 0;
      remainDistKm = totalDistKm;
      updateMetricsDisplay(totalDistKm, walkedDistKm, remainDistKm);
    }
  }

  // ============================================================
  // 공통 컨트롤 (취소 및 초기화 완벽 동기화)
  // ============================================================
  function togglePanelCollapse() {
    isPanelCollapsed = !isPanelCollapsed;
    var panel = document.getElementById('rt-bottom-panel');
    var label = document.getElementById('btn-collapse-label');
    if (isPanelCollapsed) {
      panel.classList.add('collapsed');
      label.textContent = '메뉴 펼치기';
    } else {
      panel.classList.remove('collapsed');
      label.textContent = '메뉴 접기';
    }
  }

  function undoLastPoint() {
    if (waypointCoords.length > 0) {
      waypointCoords.pop();
      if (waypointCoords.length >= 2) {
        calculateSmartRoute();
      } else if (waypointCoords.length === 1) {
        if (activePolyline) { activePolyline.setMap(null); activePolyline = null; }
        renderWaypointPins();
        updateMetricsDisplay(0, 0, 0);
      } else {
        resetRoute();
      }
      return;
    }

    if (rawPathPoints.length > 0) {
      rawPathPoints.pop();
      if (rawPathPoints.length >= 2) {
        drawPolyline(rawPathPoints);
        totalDistKm = activePolyline ? activePolyline.getLength() / 1000.0 : 0;
        walkedDistKm = 0;
        remainDistKm = totalDistKm;
        updateMetricsDisplay(totalDistKm, walkedDistKm, remainDistKm);
      } else {
        if (activePolyline) { activePolyline.setMap(null); activePolyline = null; }
        updateMetricsDisplay(0, 0, 0);
      }
    }
  }

  function resetRoute() {
    if (isHiking) {
      alert('산행 진행 중에는 초기화할 수 없습니다. 산행을 먼저 종료하세요.');
      return;
    }
    rawPathPoints = [];
    waypointCoords = [];
    if (activePolyline) { activePolyline.setMap(null); activePolyline = null; }
    waypointOverlays.forEach(function(ov) { ov.setMap(null); });
    waypointOverlays = [];
    totalDistKm = 0;
    walkedDistKm = 0;
    remainDistKm = 0;
    updateMetricsDisplay(0, 0, 0);
    setStatusText('더블터치: 출발 ➔ 경유 ➔ 도착 산길 연결', false);
    speak('경로가 초기화되었습니다.');
  }

  function toggleSkyview() {
    isSkyview = !isSkyview;
    var btn = document.getElementById('btn-skyview');
    if (isSkyview) {
      map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);
      btn.classList.add('active');
    } else {
      map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP);
      btn.classList.remove('active');
    }
    if (isTerrain) map.addOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
  }

  function toggleTerrain() {
    isTerrain = !isTerrain;
    var btn = document.getElementById('btn-terrain');
    if (isTerrain) {
      map.addOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
      btn.classList.add('active');
      speak('등고선 레이어가 켜졌습니다.');
    } else {
      map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
      btn.classList.remove('active');
      speak('등고선 레이어가 꺼졌습니다.');
    }
  }

  function toggleVoice() {
    isVoiceOn = !isVoiceOn;
    var btn = document.getElementById('btn-voice');
    if (isVoiceOn) {
      btn.classList.add('voice-on');
      speak('음성 안내가 켜졌습니다.');
    } else {
      btn.classList.remove('voice-on');
      window.speechSynthesis.cancel();
    }
  }

  window.onload = function() {
    if (typeof kakao !== 'undefined' && kakao.maps) {
      kakao.maps.load(initKakaoMap);
    }
  };
</script>
