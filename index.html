<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>HikingMap_Test</title>
  
  <!-- 카카오 지도 SDK (JavaScript 키 적용 완료) -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=fd3700902efcb45ab6ee8c1baf09338a&autoload=false&libraries=services"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif;
      background-color: #0b0f19;
      color: #fff;
    }

    #map-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    /* 상단 컨트롤 바 */
    .top-bar {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 16px);
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      z-index: 20;
      pointer-events: none;
    }
    .top-controls {
      display: flex;
      gap: 6px;
      pointer-events: auto;
      background: rgba(18, 24, 38, 0.88);
      backdrop-filter: blur(12px);
      padding: 4px 6px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .toggle-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }
    .toggle-btn.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }

    .status-badge {
      pointer-events: auto;
      background: rgba(18, 24, 38, 0.88);
      backdrop-filter: blur(12px);
      padding: 7px 12px;
      border-radius: 20px;
      border: 1px solid rgba(245, 158, 11, 0.8);
      color: #f59e0b;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      background-color: #f59e0b;
      border-radius: 50%;
      box-shadow: 0 0 6px #f59e0b;
    }

    /* 하단 메인 패널 */
    .bottom-panel {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
      left: 14px;
      right: 14px;
      background: rgba(18, 24, 38, 0.92);
      backdrop-filter: blur(16px);
      border-radius: 22px;
      padding: 16px 16px 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
      z-index: 20;
    }

    .hint-banner {
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 14px;
      letter-spacing: -0.3px;
    }

    .stats-container {
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 0 6px;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }
    .stat-title {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 21px;
      font-weight: 700;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }
    .stat-value.highlight {
      color: #38bdf8;
    }

    .action-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .sub-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 11px 0;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .sub-btn:active {
      background: rgba(255, 255, 255, 0.15);
    }
    .sub-btn.active {
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .main-btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 13px 0;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(3, 105, 161, 0.35);
    }
    .main-btn:active {
      filter: brightness(0.92);
    }

    /* 하단 개발자 크레딧 배지 */
    .footer-badge {
      position: absolute;
      bottom: -28px;
      right: 4px;
      background: rgba(18, 24, 38, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3px 8px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #94a3b8;
    }
    .tag-ver {
      background: #0284c7;
      color: #ffffff;
      padding: 1px 5px;
      border-radius: 5px;
      font-size: 9.5px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="map-wrapper">
    <!-- 지도 엘리먼트 -->
    <div id="map"></div>

    <!-- 상단 컨트롤러 -->
    <div class="top-bar">
      <div class="top-controls">
        <button id="btn-skyview" class="toggle-btn active" onclick="toggleSkyview()">
          🦅 카카오 스카이뷰
        </button>
        <button id="btn-terrain" class="toggle-btn" onclick="toggleTerrain()">
          🌾 카카오 등고선
        </button>
      </div>
      <div class="status-badge">
        <div class="status-dot"></div>
        <span>등산로 경로 연결 중...</span>
      </div>
    </div>

    <!-- 하단 데이터 및 조작 패널 -->
    <div class="bottom-panel">
      <div class="hint-banner">
        지도 위 등산로를 콕 터치해 코스를 이어가세요
      </div>

      <div class="stats-container">
        <div class="stat-item">
          <div class="stat-title">총 산행 거리 (실측)</div>
          <div class="stat-value"><span id="total-dist">0.00</span> km</div>
        </div>
        <div class="stat-item">
          <div class="stat-title">예상 산행시간</div>
          <div class="stat-value"><span id="total-time">0</span>분</div>
        </div>
        <div class="stat-item">
          <div class="stat-title">도착 예정 시간</div>
          <div class="stat-value highlight" id="eta-time">--:--</div>
        </div>
      </div>

      <div class="action-row">
        <button class="sub-btn" id="btn-curpos" onclick="setCurrentLocationStart()">
          📍 내 위치를 출발점으로
        </button>
        <button class="sub-btn" onclick="undoLastPoint()">
          ↩ 직전 지점 취소
        </button>
      </div>

      <button class="main-btn" onclick="startHiking()">
        🚀 코스 확정 & 실시간 산행 시작
      </button>

      <div class="footer-badge">
        <span>🥨 개발자 꿀꽈배기</span>
        <span class="tag-ver">v1.5</span>
      </div>
    </div>
  </div>

  <script>
    let map = null;
    let isSkyview = true;
    let isTerrain = false;

    let pathCoordinates = [];
    let markers = [];
    let polyline = null;

    // 양산 사송리 및 금정산 일대 중심 좌표
    const centerPoint = { lat: 35.3115, lng: 129.0735 };

    // 카카오 지도 SDK 비동기 초기화
    function startApp() {
      if (typeof kakao === 'undefined' || !kakao.maps) {
        alert("카카오 지도 SDK를 불러오지 못했습니다. 카카오 개발자 콘솔의 [Web 플랫폼 등록]에 'https://jangaom80-blip.github.io' 가 정확히 등록되어 있는지 확인해 주세요.");
        return;
      }

      kakao.maps.load(function() {
        const container = document.getElementById('map');
        const options = {
          center: new kakao.maps.LatLng(centerPoint.lat, centerPoint.lng),
          level: 5 // 등산로가 잘 보이는 레벨
        };

        map = new kakao.maps.Map(container, options);

        // 스카이뷰(위성+지도 라벨) 기본 적용
        map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);

        // 코스 연결용 폴리라인
        polyline = new kakao.maps.Polyline({
          map: map,
          path: [],
          strokeWeight: 5,
          strokeColor: '#f59e0b',
          strokeOpacity: 0.95,
          strokeStyle: 'solid'
        });

        // 지도 클릭(터치) 시 등산로 좌표 연결
        kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
          addPoint(mouseEvent.latLng);
        });
      });
    }

    // DOM 로드 완료 후 실행
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startApp);
    } else {
      startApp();
    }

    // 카카오 스카이뷰 토글
    function toggleSkyview() {
      if (!map) return;
      const btn = document.getElementById('btn-skyview');
      isSkyview = !isSkyview;

      if (isSkyview) {
        map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);
        btn.classList.add('active');
      } else {
        map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP);
        btn.classList.remove('active');
      }
    }

    // 등고선 오버레이 토글
    function toggleTerrain() {
      if (!map) return;
      const btn = document.getElementById('btn-terrain');
      isTerrain = !isTerrain;

      if (isTerrain) {
        map.addOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
        btn.classList.add('active');
      } else {
        map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
        btn.classList.remove('active');
      }
    }

    // 좌표 추가
    function addPoint(latLng) {
      if (!map) return;
      pathCoordinates.push(latLng);

      const marker = new kakao.maps.Marker({
        position: latLng,
        map: map
      });
      markers.push(marker);

      polyline.setPath(pathCoordinates);
      updateStats();
    }

    // 직전 지점 취소
    function undoLastPoint() {
      if (!pathCoordinates.length) return;

      pathCoordinates.pop();
      const lastMarker = markers.pop();
      if (lastMarker) lastMarker.setMap(null);

      polyline.setPath(pathCoordinates);
      updateStats();
    }

    // 산행 실측거리 및 예상시간 계산
    function updateStats() {
      if (pathCoordinates.length < 2) {
        document.getElementById('total-dist').innerText = "0.00";
        document.getElementById('total-time').innerText = "0";
        document.getElementById('eta-time').innerText = "--:--";
        return;
      }

      // 실측 거리 (m -> km)
      const distMeters = polyline.getLength();
      const distKm = distMeters / 1000;
      document.getElementById('total-dist').innerText = distKm.toFixed(2);

      // 평균 등산 속도 2.5km/h 기준
      const minutes = Math.round((distKm / 2.5) * 60);
      document.getElementById('total-time').innerText = minutes;

      // 도착 예정 시간
      const now = new Date();
      now.setMinutes(now.getMinutes() + minutes);
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('eta-time').innerText = `${h}:${m}`;
    }

    // 내 위치를 출발점으로
    function setCurrentLocationStart() {
      if (!navigator.geolocation || !map) {
        alert("위치 서비스 이용이 불가능합니다.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const userLatLng = new kakao.maps.LatLng(position.coords.latitude, position.coords.longitude);
          map.panTo(userLatLng);
          addPoint(userLatLng);
          document.getElementById('btn-curpos').classList.add('active');
        },
        function(err) {
          alert("위치를 가져올 수 없습니다: " + err.message);
        },
        { enableHighAccuracy: true }
      );
    }

    // 코스 확정
    function startHiking() {
      if (pathCoordinates.length < 2) {
        alert("지도를 터치하여 2곳 이상의 코스 포인트를 연결해 주세요.");
        return;
      }
      alert("등산 코스가 확정되었습니다! 안전한 산행을 시작합니다 🥾");
    }
  </script>
</body>
</html>
